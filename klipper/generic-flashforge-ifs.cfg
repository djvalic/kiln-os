# This file contains common pin mappings for the Flashforge IFS (Intelligent Filament System)
# multi-material unit MCU used with the Flashforge Adventurer 5X.
#
# To use this config, the firmware should be compiled for the
# Nations Technologies N32G455xB (ARM Cortex-M4F, 144MHz).
# - Micro-controller Architecture: STMicroelectronics STM32
# - Processor model: N32G455xB
# - Bootloader offset: 64KiB bootloader (0x08010000)
# - Clock Reference: 12 MHz crystal
# - Communication interface: Serial (on USART1 PA10/PA9)
# - Enable RS485 Transmit Enable (DE) pin: enabled (PA11)
# - Baud rate for serial port: 115200

# See docs/Config_Reference.md for a description of parameters.

[mcu ifs]
serial: /dev/ttyS4
baud: 115200
restart_method: command

# Status LEDs / Power
[output_pin ifs_pb5]
pin: ifs:PB5
value: 1

[output_pin ifs_pb6]
pin: ifs:PB6
value: 0

# --- Stepper Motors ---

# Feeder Motor (Direct drive gear for pushing/pulling filament)
[manual_stepper ifs_feeder]
step_pin: ifs:PA0
dir_pin: !ifs:PA1
enable_pin: !ifs:PA5
microsteps: 8
rotation_distance: 4.5
velocity: 100
accel: 500

[tmc2209 manual_stepper ifs_feeder]
uart_pin: ifs:PA3
tx_pin: ifs:PA2
interpolate: True
run_current: 0.6
hold_current: 0.3
sense_resistor: 0.110

# Selector Motor (Channel selector positioning)
[manual_stepper ifs_selector]
step_pin: ifs:PA7
dir_pin: !ifs:PA6
enable_pin: !ifs:PB1
endstop_pin: ^!ifs:PB9
microsteps: 8
rotation_distance: 4.0
velocity: 100
accel: 500

[tmc2209 manual_stepper ifs_selector]
uart_pin: ifs:PC5
tx_pin: ifs:PC4
interpolate: True
run_current: 0.6
hold_current: 0.3
sense_resistor: 0.110

# --- Spool Sensors (Analog ADC Channels) ---

[adc_temperature ifs_raw_adc]
temperature1: 0
voltage1: 0
temperature2: 4095
voltage2: 3.3

[temperature_sensor ifs_spool1_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC0
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool1_buffer]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC1
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool2_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC2
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool2_buffer]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC3
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool3_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB12
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool3_buffer]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB13
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool4_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB14
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool4_buffer]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB15
min_temp: -100
max_temp: 10000
