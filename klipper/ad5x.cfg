# Flashforge AD5X: mainline Klipper config, factory defaults.
#
# Installed read-only as /usr/share/ad5x/config/ad5x.cfg and included by the
# printer's own printer.cfg (klipper/printer.cfg is its template), so image
# updates bring new defaults. Only what is true of every AD5X (hardware,
# safety limits) and the stock firmware's own behaviour lives here: with
# nothing else, the printer behaves as stock. This system's own choices
# (its print start with a mesh every print, prime line, quick actions, ...)
# are editable files in the printer's config directory, macros/*.cfg, read
# at the end of this file; per-printer values go in unit.cfg (from stock's
# settings) and local.cfg (overrides), both included by printer.cfg after
# this file. File-by-file split: docs/config-layout.md. Tested on the
# user's unit 2026-10-16 (docs/bring-up.md).
#
# Ported from the stock config (software 3.1.0 printer.base.cfg plus the
# stock printer.cfg [extruder] part) to current mainline Klipper syntax.
# See docs/klipper-fork-diff.md for where each stock section and Flashforge
# command went. Values that couldn't be confirmed are marked "TODO:" with the
# reason.
#
# Hardware (from the stock config and the MCU data dictionaries, see
# docs/motion-mcu.md):
#   [mcu]        mainboard, Nations N32G455 (Klipper "stm32f103xe" @144 MHz), /dev/ttyS2
#   [mcu eboard] toolhead board, N32G455 behind a 64 KB bootloader, /dev/ttyS5
#   IFS          own controller on /dev/ttyS4, driven by klipper/extras/ifs.py
#
# Requires mainline MCU firmware built for both boards (MACH_N32G45x, 144 MHz,
# USART1 PA9/PA10, 230400 baud; eboard with the 64 KiB bootloader offset).
# The stock MCU images use an older protocol plus Flashforge-only commands
# and aren't a target for this config.

[include ifs.cfg]

#####################################################################
# MCUs
#####################################################################

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu eboard]
# The eboard bootloader waits after power-on until the host sends 'A'
# (stock: /usr/prog/klipper/checkEboard). tools/boot_eboard.py does that
# handshake; run it before klippy (os/systemd/eboard-boot.service), or this
# MCU never comes up.
serial: /dev/ttyS5
baud: 230400
restart_method: command

#####################################################################
# Kinematics
#####################################################################

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
# Stock had max_accel_to_decel: 5000 (removed upstream 20250811).
# 1 - 5000/20000 = 0.75 gives the same behaviour.
minimum_cruise_ratio: 0.75
max_z_velocity: 25
max_z_accel: 500
square_corner_velocity: 25

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
# X endstop is on the toolhead board: X homing is a multi-MCU homing move
# (both CoreXY steppers on [mcu], endstop on [eboard]). Stock raised
# TRSYNC_TIMEOUT from 0.025 to 0.05 s in klippy/mcu.py for this.
# TODO: if mainline reports "Communication timeout during homing", apply
# klipper/patches/trsync-timeout-50ms.patch (no config option upstream).
endstop_pin: !eboard:PA15
# TODO: stock firmwareExe applies a per-unit X/Y offset ("xOffset"/"yOffset"
# in its settings file) via the fork-only ADJUST_ENDSTOP_POS + SAVE_CONFIG.
# The real unit's printer.cfg may carry a SAVE_CONFIG override for
# position_endstop. Read it off the printer before trusting 220.
position_endstop: 220
position_max: 225
position_min: -20
homing_speed: 50
homing_retract_dist: 10
homing_retract_speed: 25

[stepper_y]
step_pin: PC4
dir_pin: PA7
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: !PC12
# TODO: same per-unit offset caveat as stepper_x.
position_endstop: 220
position_max: 232
position_min: -20
homing_speed: 50
homing_retract_dist: 10
homing_retract_speed: 25

[stepper_z]
step_pin: PC7
dir_pin: PC8
enable_pin: !PB14
microsteps: 16
rotation_distance: 8
# Z homes to MAX (bed fully down) on a dedicated switch. Like stock, Z zero
# stays the homed one: the bed mesh, plus a per-print offset from a centre
# probe (_CHECK_Z below), corrects the first layer.
endstop_pin: PD2
# TODO: 220 is the stock nominal; the mesh absorbs a per-unit difference.
position_endstop: 220
position_max: 230
position_min: -10
homing_speed: 20
homing_retract_dist: 5
homing_retract_speed: 10

[tmc2209 stepper_x]
uart_pin: PB11
interpolate: True
# Community value (AD5M shipping; 0.9 A reported to work there, not yet tested on this unit). Stock AD5X was 1.1.
run_current: 0.9
hold_current: 0.9
sense_resistor: 0.10

[tmc2209 stepper_y]
uart_pin: PB0
interpolate: True
# Community value, as X. Stock AD5X was 1.1.
run_current: 0.9
hold_current: 0.9
sense_resistor: 0.10

[tmc2209 stepper_z]
uart_pin: PB15
interpolate: True
# Community value (AD5M shipping, 0.6 A). Stock AD5X was 0.9. Not yet tested on this unit.
run_current: 0.6
hold_current: 0.6
sense_resistor: 0.10

# NOTE: the stock fork disabled Klipper's periodic TMC error checks
# (DRV_STATUS/GSTAT polling) in tmc.py. Mainline has them on. That's safer,
# but if the drivers or the single-wire UART links are marginal, mainline
# may shut down with TMC errors that stock silently ignored. Watch for it.

#####################################################################
# Homing (stock HOME / MYG67 macros)
#####################################################################

# Stock homes Z, then X, then Y. If the Y endstop is already pressed it first
# fakes a position and backs Y off 20 mm, so the endstop can release.
[homing_override]
axes: xyz
gcode:
  QUERY_ENDSTOPS
  {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  _HOME_ZXY X={1 if all or 'X' in params else 0} Y={1 if all or 'Y' in params else 0} Z={1 if all or 'Z' in params else 0}

# Macro names must not contain a digit followed by a letter (Klipper would
# parse "_AD5X" as "_AD5" plus an X parameter). Called with X=, Y=, Z= set
# to 1 for each axis to home (G28's bare axis letters can't be passed on).
[gcode_macro _HOME_ZXY]
gcode:
  {% set hx = params.X|default(0)|int %}
  {% set hy = params.Y|default(0)|int %}
  {% set hz = params.Z|default(0)|int %}
  {% if hy and printer.query_endstops.last_query["stepper_y"]|default(0) == 1 %}
    {% set z0 = printer.toolhead.position.z %}
    SET_KINEMATIC_POSITION X=0 Y=0 Z={z0}
    G91
    G1 Y-20 F600
    G90
  {% endif %}
  {% if hz %}
    G28 Z
    # Z homes with the bed fully down, so the next lift (the swap's +5 mm)
    # would run into the top of Z travel. Raise the bed 5 mm off the stop
    # (nozzle 5 mm lower, Z 215); later moves are absolute, so they are unaffected.
    G90
    G1 Z215 F600
  {% endif %}
  {% if hx %}
    G28 X
  {% endif %}
  {% if hy %}
    G28 Y
  {% endif %}

[force_move]
enable_force_move: True

[query_endstops]

#####################################################################
# Extruder and hotend (eboard)
#####################################################################

[extruder]
step_pin: eboard:PB14
dir_pin: !eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
rotation_distance: 4.39185
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eboard:PA8
sensor_type: Generic 3950
sensor_pin: eboard:PA0
# TODO: these PID values come from the SAVE_CONFIG block of the stock
# printer.cfg shipped in zMod's native-firmware mirror (one unit). The
# setup wizard's PID step replaces them (ad5x-tuning.cfg, see setup.cfg).
control: pid
pid_Kp: 20.651
pid_Ki: 1.480
pid_Kd: 72.021
# Stock: min_temp -100, which can't catch an open/unplugged thermistor.
# 0 is stricter. TODO: confirm a cold printer reads well above 0.
min_temp: 0
max_temp: 350
# Stock: min_extrude_temp 0 (cold extrusion always allowed, because
# firmwareExe did its own checks). Mainline default 170 restored here.
# TODO: lower only if an IFS load/unload path really needs a cold extruder.
min_extrude_temp: 170
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
# Long extrude-only moves for filament load/unload and purges (stock values).
max_extrude_only_distance: 1500.0
# Stock sets this to 1000, which effectively turns off the check (purge
# blobs). Kept so swap purges don't trip it.
max_extrude_cross_section: 1000

# Hotend power enable. eboard:PA8 only switches the heater; its supply is
# enabled by eboard:PB7, which stock firmware drives itself and mainline
# leaves low (no heat). Same as zMod's klipper13 and the AD5M mod configs.
# shutdown_value: 0 also cuts hotend power on any Klipper shutdown.
[output_pin _extruder_heater]
pin: eboard:PB7
value: 1
shutdown_value: 0

[verify_heater extruder]
# Stock: max_error 290. Mainline default 120 is stricter; the rest matches
# stock. TODO: if fan-on purges trip it, raise toward stock, never beyond.
max_error: 120
check_gain_time: 200
hysteresis: 10
heating_gain: 10

[tmc2209 extruder]
uart_pin: eboard:PB10
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.10

[heater_fan heat_fan]
pin: eboard:PB4
max_power: 1.0
heater: extruder
heater_temp: 50.0

# Part cooling fan, as stock: [fan_generic fanM106] with M106/M107 macros
# (HelixScreen's AD5X preset and stock's own tools use this name). Stock's
# macros route P/T indexes 2, 101 and 102 to a chamber fan the AD5X doesn't
# have; those are ignored here.
[fan_generic fanM106]
pin: eboard:PB5

[gcode_macro M106]
description: Part cooling fan (fanM106), S0-255
gcode:
  {% set s = params.S|default(255)|float %}
  {% set idx = params.P|default(params.T|default(0))|int %}
  {% if idx not in [2, 101, 102] %}
    SET_FAN_SPEED FAN=fanM106 SPEED={([s, 255.0]|min / 255.0)|round(3)}
  {% endif %}

[gcode_macro M107]
description: Part cooling fan off
gcode:
  {% set idx = params.P|default(params.T|default(0))|int %}
  {% if idx not in [2, 101, 102] %}
    SET_FAN_SPEED FAN=fanM106 SPEED=0
  {% endif %}

#####################################################################
# Bed
#####################################################################

[heater_bed]
heater_pin: PB9
sensor_type: Generic 3950
sensor_pin: PA0
pullup_resistor: 4700
control: pid
# TODO: stock values, not checked on this unit. The setup wizard's PID
# step replaces them (ad5x-tuning.cfg).
pid_Kp: 32.79
pid_Ki: 4.970
pid_Kd: 54.118
# The bed thermistor jitters by about 0.5-1 C. With 1 s smoothing (Klipper's
# default) a large tuned Kd turned each downward jitter into a full-power
# burst: on 2026-10-16 the bed sat at 61-62 C for a 55 C target with
# 40% bursts between 0% readings. 3 s smoothing keeps the derivative quiet;
# tune the bed PID (setup wizard) with it in place.
smooth_time: 3.0
# Stock limits the bed to 40% duty. Kept.
# TODO: find out why (PSU budget? heater rating?) before changing it.
max_power: 0.4
# Stock: min_temp -100. See the extruder note.
min_temp: 0
max_temp: 130

[verify_heater heater_bed]
# Same as stock.
max_error: 120
check_gain_time: 200
hysteresis: 10
heating_gain: 10

#####################################################################
# Probe and bed mesh
#####################################################################

# Nozzle-contact probe (strain gauges under the bed) with a digital trigger
# on mainboard PB3. Offsets are 0 because the nozzle is the probe.
# TODO: unknown how the strain gauges are tared on the AD5X. On the AD5M,
# Klipper does it through extra MCU commands (xblax/klipper
# flashforge_loadcell). The stock AD5X MCU firmware has no such commands and
# the stock config has no weight sensor, so taring happens somewhere else
# (firmwareExe? another UART?). Find this out in Phase 3 before relying on
# the probe. A probe that is never tared may trigger early or not at all.
[probe]
pin: !PB3
x_offset: 0
y_offset: 0
# Negative: the trigger fires after the nozzle has pressed into the bed.
# Stock's per-unit "zProbeOffset" is applied as a G-code Z offset at print
# start (saved zoffset, else z_offset in unit.cfg; see SET_GCODE_OFFSET
# below), not here.
z_offset: -0.25
speed: 5
samples: 3
samples_result: average
samples_tolerance: 0.1
samples_tolerance_retries: 4

[bed_mesh]
speed: 300
horizontal_move_z: 5
move_check_distance: 8
mesh_min: 0, 0
mesh_max: 215, 215
probe_count: 5, 5
mesh_pps: 5, 5
algorithm: bicubic
bicubic_tension: 0.2

# Bed weighing board on its own UART: tared before every probing run,
# like stock (docs/bed-weighing-board.md).
[ad5x_weight]
serial: /dev/ttyS7
baud: 9600

# HelixScreen tares before probing when a LOAD_CELL_TARE macro exists
# (zMod's name for it).
[gcode_macro LOAD_CELL_TARE]
description: Zero the bed strain gauges (same as WEIGHT_TARE)
gcode:
  WEIGHT_TARE

# Stock tares the strain gauges before each mesh. After a full mesh into
# the "default" profile, probe the bed centre once and save it: _CHECK_Z
# compares each print against it. (Stock reads the saved centre from its
# own settings; one extra probe here.) An adaptive mesh or another
# profile doesn't touch the saved centre: it belongs to "default".
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
gcode:
  {% set adaptive = params.ADAPTIVE|default(0)|int %}
  {% set profile = params.PROFILE|default('default') %}
  G90
  {% if printer.toolhead.position.z < 5 %}
    G1 Z5 F800
  {% endif %}
  WEIGHT_TARE
  _BED_MESH_CALIBRATE_BASE {rawparams}
  {% if not adaptive and profile == 'default' %}
    G1 Z5 F800
    G1 X107.5 Y107.5 F30000
    WEIGHT_TARE
    PROBE
    _SAVE_CENTER_Z
  {% endif %}

# The toolhead Z where the last PROBE triggered (what Klipper's deprecated
# printer.probe.last_z_result gave: last_probe_position has the probe's
# z_offset taken off), so centre values saved before stay comparable.
[gcode_macro _SAVE_CENTER_Z]
gcode:
  SAVE_VARIABLE VARIABLE=ad5x_center_z VALUE={(printer.probe.last_probe_position.z + printer.configfile.settings.probe.z_offset)}

# Print-start status line: the screen (M117, display_status.message) and
# the console.
[gcode_macro _PRINT_STATUS]
gcode:
  {% set msg = params.MSG|default('') %}
  {% if msg %}
    M117 {msg}
    RESPOND MSG="{msg}"
  {% else %}
    M117
  {% endif %}

# Stock's per-print Z check (its "checkZ"), run after homing and heating and
# the nozzle brush at the purge box: tare and probe at the front edge
# (X60 Y-3), scrub the nozzle along the edge just above that height while
# it cools to 140, then tare and probe the bed centre. The difference from
# the centre saved with the mesh becomes the G-code Z offset when it is
# between -0.5 and 2.0 mm. With MESH=1 (stock's "level before print") a new
# bed mesh replaces the centre check (ADAPTIVE=1: only the print area).
# Leaves the nozzle at 140: heat to print temperature afterwards.
[gcode_macro _CHECK_Z]
gcode:
  _PRINT_STATUS MSG="Checking Z"
  G90
  G1 Z5 F800
  G1 X60 Y-3 F30000
  WEIGHT_TARE
  PROBE
  _CHECK_Z_SCRUB MESH={params.MESH|default(0)|int} ADAPTIVE={params.ADAPTIVE|default(0)|int}

[gcode_macro _CHECK_Z_SCRUB]
gcode:
  {% set z = (printer.probe.last_probe_position.z + printer.configfile.settings.probe.z_offset) %}
  _PRINT_STATUS MSG="Cleaning nozzle on the bed edge"
  M106 S255
  G1 X60 Y-3 F12000
  G1 Z{z + 0.3} F1000
  G1 X130 F1200
  G1 X150 F1200
  G1 Z{z + 0.1} F1000
  M104 S140
  G4 P2000
  M106 S0
  G1 Z5 F6000
  {% if params.MESH|default(0)|int and params.ADAPTIVE|default(0)|int %}
    # Only the area the print covers (objects from the slicer's labels via
    # [exclude_object]; without them Klipper probes the whole bed). Klipper
    # doesn't save an adaptive mesh as a profile, so the "default" one,
    # which the per-print Z check uses, stays as it was.
    _PRINT_STATUS MSG="Meshing print area"
    BED_MESH_CALIBRATE ADAPTIVE=1
    _APPLY_Z_OFFSET
  {% elif params.MESH|default(0)|int %}
    _PRINT_STATUS MSG="Meshing the bed"
    BED_MESH_CALIBRATE
    _APPLY_Z_OFFSET
  {% else %}
    _PRINT_STATUS MSG="Checking Z"
    G1 X107.5 Y107.5 F30000
    WEIGHT_TARE
    PROBE
    _CHECK_Z_APPLY
  {% endif %}

# Stock measures the drift (diff) and sends SET_GCODE_OFFSET Z=<diff>, but
# a few seconds later, at print start, replaces it with SET_GCODE_OFFSET
# Z=<zProbeOffset> (the Z offset tuned on the screen; captured in the
# sandbox, docs/bed-weighing-board.md). So the drift has no effect on stock.
# Same here by default; apply_drift: 1 adds it to the saved Z offset
# (variable drift holds what was added, so SET_GCODE_OFFSET saves without it).
[gcode_macro _CHECK_Z_APPLY]
variable_apply_drift: 0
variable_drift: 0
gcode:
  {% set saved = printer.save_variables.variables.ad5x_center_z|default(none) %}
  {% set drift = 0 %}
  # No saved centre: there is no default mesh to load either, and the print
  # would run unmeshed. Stop the start instead (before the print moves).
  {% if saved is none %}
    { action_raise_error("_CHECK_Z: no saved centre Z (no default mesh): run BED_MESH_CALIBRATE, then print") }
  {% endif %}
  BED_MESH_PROFILE LOAD=default
  {% set diff = (printer.probe.last_probe_position.z + printer.configfile.settings.probe.z_offset) - saved %}
  {% if diff >= -0.5 and diff <= 2.0 %}
    {% set drift = diff if apply_drift else 0 %}
    RESPOND MSG="_CHECK_Z: centre drift {'%.3f' % diff} mm ({'applied' if apply_drift else 'not applied, as stock'})"
  {% else %}
    # Stock skips the offset silently here; say so instead.
    RESPOND TYPE=error MSG="_CHECK_Z: centre moved {diff} mm since the mesh; re-run BED_MESH_CALIBRATE"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_CHECK_Z_APPLY VARIABLE=drift VALUE={drift}
  _APPLY_Z_OFFSET DRIFT={drift}
  G1 Z5 F800

# Z offset (stock: zProbeOffset, tuned on the screen, kept by firmwareExe).
# Every Z offset set with SET_GCODE_OFFSET Z= or Z_ADJUST= (screen Z
# calibration, baby-steps from any UI or the console) is saved as
# save_variables zoffset = {'z': ..}, the layout HelixScreen reads as the
# firmware-kept offset (its "Helper-Script" provider). Prints apply the
# saved value (_APPLY_Z_OFFSET); unit.cfg z_offset is only the starting
# value, copied to zoffset at the first start. Macros that set a temporary
# offset (PRINT_START's reset) call _SET_GCODE_OFFSET instead.
[gcode_macro SET_GCODE_OFFSET]
rename_existing: _SET_GCODE_OFFSET
gcode:
  {% set z = printer.gcode_move.homing_origin.z %}
  _SET_GCODE_OFFSET {rawparams}
  {% if 'Z' in params or 'Z_ADJUST' in params %}
    {% set new = params.Z|float if 'Z' in params else z + params.Z_ADJUST|float %}
    {% set keep = new - printer['gcode_macro _CHECK_Z_APPLY'].drift|float %}
    SAVE_VARIABLE VARIABLE=zoffset VALUE="{ {'z': keep|round(4)} }"
  {% endif %}

# Apply the print Z offset: saved zoffset.z, else unit.cfg z_offset; DRIFT=
# is added on top (not saved). The offset sits on top of whichever mesh is
# loaded (the saved "default" one after the Z check, or the one just
# probed): both are measured with the same probe, so the same saved offset
# means the same first-layer height on either.
[gcode_macro _APPLY_Z_OFFSET]
gcode:
  {% set saved = printer.save_variables.variables.zoffset|default({}) %}
  {% set z = saved.z if saved.z is number else printer['gcode_macro _AD5X_UNIT'].z_offset|float %}
  _SET_GCODE_OFFSET Z={z + params.DRIFT|default(0)|float} MOVE=1

# First start: copy unit.cfg's z_offset (stock zProbeOffset) to zoffset.
# Delete the zoffset line from variables.cfg to start over from unit.cfg.
# A delayed_gcode's template is rendered when its timer fires, before it
# waits for the G-code lock: the check is in a macro, so it is made when it
# runs (else a command already running at start, e.g. the setup wizard's
# Z offset step, gets its saved offset overwritten afterwards).
[delayed_gcode _SEED_ZOFFSET]
initial_duration: 1
gcode:
  _SEED_ZOFFSET_NOW

[gcode_macro _SEED_ZOFFSET_NOW]
gcode:
  {% if 'zoffset' not in printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=zoffset VALUE="{ {'z': printer['gcode_macro _AD5X_UNIT'].z_offset|float} }"
  {% endif %}

# Print start as the stock app does it (docs/print-start.md), the factory
# default. The printer's macros/print_start.cfg (user space, read after
# this file) replaces it with this system's own start: a mesh of the print
# area every print, prime line, ... Delete that file to print with this one.
# Slicer start G-code, e.g. (OrcaSlicer placeholders):
#   PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer] TOOL=[initial_tool]
# BED, EXTRUDER: temperatures (default 60 / 220). TOOL: first slicer tool,
# loaded from the IFS channel the tool map names (TOOL+1 unless
# IFS_MAP_TOOL changed it; omit or -1 without the IFS), always fresh as
# stock. LEVEL=1: new full bed mesh instead of the centre Z check (stock
# "level before print"); ADAPTIVE=1 with it: only the print area.
# This is the stock start. The user's macros/print_start.cfg defines
# PRINT_START again and overrides it (it adds SOAK=, mesh every print); both
# are needed, so do not delete either.
[gcode_macro PRINT_START]
description: Stock print start: home, heat, purge, brush, Z check (LEVEL=1: mesh), load the first tool
gcode:
  # No EXTRUDER=/BED=: the temperature the file already set (a slicer's own
  # M104/M140 before the start line), else 220 / 60
  {% set raw_bed = params.BED|default(printer.heater_bed.target if printer.heater_bed.target > 0 else 60)|string %}
  {% set raw_nozzle = params.EXTRUDER|default(printer.extruder.target if printer.extruder.target > 0 else 220)|string %}
  # Same checks as macros/print_start.cfg: an unexpanded placeholder stops the
  # start (|float would turn it into 0, issue #12).
  {% if not raw_bed.replace('.', '', 1).isdigit() %}
    { action_raise_error("PRINT_START: BED=" ~ raw_bed ~ " is not a temperature. Use the slicer's expanded value.") }
  {% endif %}
  {% if not raw_nozzle.replace('.', '', 1).isdigit() %}
    { action_raise_error("PRINT_START: EXTRUDER=" ~ raw_nozzle ~ " is not a temperature. Use the slicer's expanded value.") }
  {% endif %}
  {% set bed = raw_bed|float %}
  {% set nozzle = raw_nozzle|float %}
  # TOOL must be a number (or -1); text such as "[initial_tool]" loads no tool
  # and shows an error (issue #12).
  {% set raw_tool = params.TOOL|default('-1')|string %}
  {% set tool_ok = raw_tool == '-1' or raw_tool.isdigit() %}
  {% set tool = raw_tool|int if tool_ok else -1 %}
  {% if not tool_ok %}
    RESPOND TYPE=error MSG="PRINT_START: TOOL={raw_tool} is not a tool number, no tool loaded. Use the slicer's expanded value (issue #12)."
  {% endif %}
  {% set level = params.LEVEL|default(0)|int %}
  {% set adaptive = params.ADAPTIVE|default(0)|int %}
  CLEAR_PAUSE
  M104 S0
  M140 S0
  G90
  M82
  M106 S0
  BED_MESH_CLEAR
  _SET_GCODE_OFFSET Z=0
  SET_GCODE_VARIABLE MACRO=_CHECK_Z_APPLY VARIABLE=drift VALUE=0
  _PRINT_STATUS MSG="Homing"
  G28
  _PURGE_BOX
  _PRINT_STATUS MSG="Heating"
  M140 S{bed}
  G1 Z5 F600
  M104 S{nozzle}
  # Heat to the bed temperature, never wait for it to cool down (as the
  # stock app): M190 waits until within 2 C either way.
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  M109 S{nozzle}
  # Purge 90 mm, retract 3 mm, wipe; then cool to 180 and brush twice.
  _PRINT_STATUS MSG="Purging at the box"
  M106 S0
  G92 E0
  G1 E90 F300
  M400
  M106 S125
  G4 P3000
  G92 E0
  G1 E-3 F300
  _PURGE_WIPE
  M104 S180
  _NOZZLE_BRUSH
  _NOZZLE_BRUSH
  _CHECK_Z MESH={level} ADAPTIVE={adaptive}
  G90
  G1 Z50 F3000
  _PRINT_STATUS MSG="Heating"
  M140 S{bed}
  M109 S{nozzle}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  G92 E0
  {% if tool >= 0 and 'ifs' in printer %}
    _PRINT_STATUS MSG="Loading first colour"
    IFS_SWAP CHANNEL={printer.ifs.tool_map[tool|string]|default(tool + 1)} FORCE=1
  {% endif %}
  _PRINT_STATUS

# End of print (slicer end G-code: PRINT_END). Retract, lift 10 mm (within
# the Z limit), park at the back, everything off. The IFS module clears the
# print's tool map by itself when the print ends.
[gcode_macro PRINT_END]
description: Retract, lift, park, heaters, fans and motors off
gcode:
  M400
  _PARK_END
  M104 S0
  M140 S0
  M106 S0
  M84 X Y E

[gcode_macro _PARK_END]
gcode:
  {% set th = printer.toolhead %}
  {% if 'xyz' in th.homed_axes %}
    {% set z = [th.position.z + 10, th.axis_maximum.z]|min %}
    G91
    {% if printer.extruder.can_extrude %}
      G1 E-2 F1800
    {% endif %}
    G90
    G1 Z{z} F600
    G1 X107.5 Y215 F9000
  {% endif %}

# Cancel (Fluidd, HelixScreen or CANCEL_PRINT): stop the file, then park
# and switch heaters and fans off (the base command leaves them on).
[gcode_macro CANCEL_PRINT]
rename_existing: _CANCEL_PRINT_BASE
description: Cancel the print, park, heaters and fans off
gcode:
  TURN_OFF_HEATERS
  M106 S0
  _CANCEL_PRINT_BASE
  _PARK_END
  M84 X Y E
  # The print's tool map ends with it (issue #13), also when cancelled paused
  {% if 'ifs' in printer %}
    IFS_MAP_TOOL RESET=1
  {% endif %}

# The purge box (trash bin) is at X 52.5 / Y 229 plus an offset: TRASH_OFFSET
# (saved in variables.cfg, trash_offset) if set, else unit.cfg's x_offset /
# y_offset. Every box move below and the zMod trash macros use the same.
# Into the purge box at the back.
[gcode_macro _PURGE_BOX]
gcode:
  {% set t = printer.save_variables.variables.trash_offset|default({}) %}
  {% set dx = t.x if t.x is defined else printer['gcode_macro _AD5X_UNIT'].x_offset|float %}
  {% set dy = t.y if t.y is defined else printer['gcode_macro _AD5X_UNIT'].y_offset|float %}
  G90
  G1 X{52.5 + dx} F12000
  G1 Y{220 + dy} F12000
  G1 Y{229 + dy} F3000
  M400

# Wipe on the box edge, ending outside it.
[gcode_macro _PURGE_WIPE]
gcode:
  {% set t = printer.save_variables.variables.trash_offset|default({}) %}
  {% set dx = t.x if t.x is defined else printer['gcode_macro _AD5X_UNIT'].x_offset|float %}
  {% set dy = t.y if t.y is defined else printer['gcode_macro _AD5X_UNIT'].y_offset|float %}
  G90
  M400
  G1 Y{220 + dy} F12000
  G1 Y{229 + dy} F3000
  G1 Y{220 + dy} F12000
  G1 Y{229 + dy} F3000
  G1 Y{220 + dy} F12000
  M400

# Brush the nozzle across the box (X65 to X78 at Y229).
[gcode_macro _NOZZLE_BRUSH]
gcode:
  {% set t = printer.save_variables.variables.trash_offset|default({}) %}
  {% set dx = t.x if t.x is defined else printer['gcode_macro _AD5X_UNIT'].x_offset|float %}
  {% set dy = t.y if t.y is defined else printer['gcode_macro _AD5X_UNIT'].y_offset|float %}
  G90
  G1 Y{220 + dy} F3000
  G1 X{78 + dx} F12000
  G1 Y{229 + dy} F3000
  G1 X{65 + dx} F12000
  G1 X{73 + dx}
  G1 X{65 + dx}
  G1 X{73 + dx}
  G1 X{65 + dx}
  G1 X{78 + dx}
  G1 Y{220 + dy}
  M400

# TRASH_OFFSET X= Y= | DX= DY= [MOVE=1]: moves the purge box (trash bin) from its factory spot,
# in mm, and saves it (variables.cfg), so it survives updates and restarts.
# X -10..10, Y -14..2 (the box is at X 52.5, Y 229). RESET=1 goes back to
# unit.cfg's x_offset / y_offset. Shows where the box is now.
# Z offset estimate from the bed load cells (Z_OFFSET_ESTIMATE); used by the
# wizard's Z offset step only when zoffset_estimate is on (setup.cfg).
[ad5x_zestimate]

[gcode_macro TRASH_OFFSET]
description: Move the purge box (trash bin): X= Y= (mm, -10..10 / -14..2), RESET=1
gcode:
  {% set t = printer.save_variables.variables.trash_offset|default({}) %}
  {% set unit = printer['gcode_macro _AD5X_UNIT'] %}
  {% set cur_x = t.x if t.x is defined else unit.x_offset|float %}
  {% set cur_y = t.y if t.y is defined else unit.y_offset|float %}
  {% set x = params.X|default(cur_x)|float + params.DX|default(0)|float %}
  {% set y = params.Y|default(cur_y)|float + params.DY|default(0)|float %}
  {% if params.RESET|default(0)|int %}
    SAVE_VARIABLE VARIABLE=trash_offset VALUE="{ {} }"
    {% set x = unit.x_offset|float %}
    {% set y = unit.y_offset|float %}
  {% elif x < -10 or x > 10 or y < -14 or y > 2 %}
    { action_raise_error("TRASH_OFFSET: X must be -10 to 10 and Y -14 to 2 mm (the box is at X 52.5 Y 229)") }
  {% else %}
    SAVE_VARIABLE VARIABLE=trash_offset VALUE="{ {'x': x|round(3), 'y': y|round(3)} }"
  {% endif %}
  RESPOND MSG="Purge box (trash bin) at X{52.5 + x|round(2)} Y{229 + y|round(2)} (offset {x|round(2)}, {y|round(2)}; RESET=1 for unit.cfg)"
  {% if params.MOVE|default(0)|int %}
    _TRASH_CHECK
  {% endif %}

# The wizard's purge box check: over the box at the nozzle's test height.
[gcode_macro _TRASH_CHECK]
gcode:
  {% set t = printer.save_variables.variables.trash_offset|default({}) %}
  {% set dx = t.x if t.x is defined else printer['gcode_macro _AD5X_UNIT'].x_offset|float %}
  {% set dy = t.y if t.y is defined else printer['gcode_macro _AD5X_UNIT'].y_offset|float %}
  G90
  G1 Z10 F3000
  G1 X{52.5 + dx} Y{220 + dy} F12000
  G1 Y{229 + dy} F3000
  M400

#####################################################################
# Toolhead sensors (analog, on the eboard)
#####################################################################

# Stock reads two analog sensors by declaring them as thermistors and
# reading the raw ADC value (fork-only GET_FILAMENT_VALUE / GET_CUT_VALUE
# and query_adc status). Kept the same way here. The "temperature" is
# meaningless but the raw value is available via QUERY_ADC.
# filamentValue: filament present in the toolhead ("Head Switch Sensor").
# cutValue: cutter lever position.
# TODO: thresholds for present/absent and cut/not-cut are unknown. Read
# both with QUERY_ADC in each state, then build a runout sensor (small extra
# or delayed_gcode poll that calls PAUSE).
[temperature_sensor filamentValue]
sensor_type: Generic 3950
sensor_pin: eboard:PA3

[temperature_sensor cutValue]
sensor_type: Generic 3950
sensor_pin: eboard:PA2

# Runout detection on the head sensor (klipper/extras/adc_filament_sensor.py).
# Present/empty band from the stock software (firmwareExe): filament present
# at <= 0.30 or >= 0.72. TODO: check with GET_FILAMENT_VALUE on the printer.
# The IFS swap templates switch this sensor off during a swap. Also shows
# up as "filament_switch_sensor toolhead" (the name HelixScreen reads).
[adc_filament_sensor toolhead]
adc: temperature_sensor filamentValue
present_below: 0.30
present_above: 0.72
pause_on_runout: True

[gcode_macro GET_FILAMENT_VALUE]
description: Raw ADC of the toolhead filament sensor (stock command)
gcode:
  QUERY_ADC NAME="temperature_sensor filamentValue"

[gcode_macro GET_CUT_VALUE]
description: Raw ADC of the cutter sensor (stock command)
gcode:
  QUERY_ADC NAME="temperature_sensor cutValue"

#####################################################################
# Fans, lights, misc hardware
#####################################################################

# Board (pcb) fan, stock's name: [fan_generic pcb_fan] on PA5. Stock switches
# it on at print start. [pcb_fan_watch] (klipper/extras/pcb_fan_watch.py) also
# runs it whenever a motor or heater is on or a print runs, and stops it 30 s
# after the last of those. It runs from a reactor timer, not a delayed_gcode,
# so a long macro (bed leveling) cannot hold it off (issue #17).
[fan_generic pcb_fan]
pin: PA5

[pcb_fan_watch]
fan: pcb_fan
heater: extruder,heater_bed
idle_timeout: 30
poll: 1.0

[led chamber_led]
white_pin: PA11
hardware_pwm: False

#####################################################################
# Accelerometer and input shaping
#####################################################################

[lis2dw]
cs_pin: eboard:PA4
# Software SPI. Since 20250417 mainline really limits software SPI to
# spi_speed. TODO: check that 500 kHz keeps up with the sample rate
# (ACCELEROMETER_QUERY). Raise it if samples drop.
spi_speed: 500000
spi_software_sclk_pin: eboard:PA5
spi_software_mosi_pin: eboard:PA7
spi_software_miso_pin: eboard:PA6
axes_map: x, y, z

[resonance_tester]
accel_chip: lis2dw
min_freq: 20
max_freq: 80
# Mainline's sweeping test needs about +/-30 mm of X/Y clearance here.
probe_points:
    110, 110, 100

[input_shaper]
# TODO: starting point from the reference unit's SAVE_CONFIG (zMod mirror),
# not this printer. The setup wizard's vibration step replaces it
# (ad5x-tuning.cfg; SHAPER_CALIBRATE needs numpy, not in the image yet).
shaper_type_x: mzv
shaper_freq_x: 60.4
shaper_type_y: mzv
shaper_freq_y: 55.0

#####################################################################
# Print handling
#####################################################################

[virtual_sdcard]
# Stock: /usr/data/gcodes/. TODO: match the Moonraker layout chosen for the
# open stack.
path: /home/klipper/printer_data/gcodes
on_error_gcode: TURN_OFF_HEATERS

# PAUSE and RESUME as pass-through macros over [pause_resume], so Mainsail's
# "gcode_macro PAUSE/RESUME not defined" check passes. No parking: the same
# moves as the built-in commands.
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause the print (pause_resume)
gcode:
  BASE_PAUSE {rawparams}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Resume a paused print (pause_resume)
gcode:
  BASE_RESUME {rawparams}

[pause_resume]
recover_velocity: 50

# Power-loss recovery (klipper/extras/ad5x_resume.py): while printing, the
# print's state is saved every 10 s; after a power cut RESUME_INTERRUPTED
# CONFIRM=1 continues it from there (Z from where it stopped, X/Y homed),
# CLEAR_INTERRUPTED forgets it. Stock has power-loss recovery too.
# The speaker: M300, PLAY_MIDI, sounds on print events, SOUND_SETUP
# (klipper/extras/ad5x_sound.py, /usr/bin/ad5x-sound)
[ad5x_sound]

# Bed heat soak: BED_SOAK_CALIBRATE measures it, PRINT_START uses it
# (klipper/extras/ad5x_soak.py, docs/print-start.md)
[ad5x_soak]

[ad5x_resume]

# Idle timeout (stock: 30 min, 1800 s). Klipper's idle_timeout runs its gcode
# when the toolhead has been still that long, with no print state check. The
# gcode is _IDLE_HEATERS_OFF, which checks the print state, the IFS and the
# heater targets before it turns the heaters off and disables the steppers
# (M18). Set the minutes with HEATER_IDLE_TIMEOUT MINUTES=n (saved in
# variables.cfg; 30 = stock; at least 5). The saved value is applied at boot
# and on change by _HEATER_IDLE_TICK, a delayed_gcode every 30 s that keeps
# the heater targets the checks compare against.
[idle_timeout]
gcode:
  _IDLE_HEATERS_OFF
timeout: 1800

[gcode_macro _IDLE_HEATERS_OFF]
description: Idle timeout action: heaters and steppers off, unless a print, an IFS swap or a heater change is in the way
gcode:
  {% set s = printer['gcode_macro _HEATER_IDLE_STATE'] %}
  {% set ps = printer.print_stats.state %}
  {% set ifs_busy = (printer.ifs|default({})).busy|default(false) %}
  {% set quiet = s.tick - s.last_change_tick >= 3 %}
  {% set unchanged = printer.extruder.target == s.nozzle and printer['heater_bed'].target == s.bed %}
  {% set on = printer.extruder.target > 0 or printer['heater_bed'].target > 0 %}
  {% set mins = (printer.idle_timeout.idle_timeout / 60)|round(1) %}
  {% if ps in ['standby', 'complete', 'cancelled', 'error'] and not ifs_busy and quiet and unchanged %}
    {% if on %}
      RESPOND TYPE=echo MSG="Heaters off: no print, IFS or heater change for {mins} min (HEATER_IDLE_TIMEOUT)"
    {% endif %}
    TURN_OFF_HEATERS
    M18
  {% elif on %}
    RESPOND TYPE=echo MSG="Heaters stay on: a print, an IFS swap or a heater change is in the way"
  {% endif %}

[gcode_macro _HEATER_IDLE_STATE]
# Written by _HEATER_IDLE_TICK: the tick count, the targets seen at the last
# tick and the tick at which they last changed
variable_tick: 0
variable_last_change_tick: -100
variable_nozzle: -1
variable_bed: -1
gcode:
  RESPOND TYPE=echo MSG="Heater idle state is kept in variables, see HEATER_IDLE_TIMEOUT"

[delayed_gcode _HEATER_IDLE_TICK]
initial_duration: 5
gcode:
  {% set s = printer['gcode_macro _HEATER_IDLE_STATE'] %}
  {% set n = printer.extruder.target %}
  {% set b = printer['heater_bed'].target %}
  {% set t = s.tick + 1 %}
  {% set last = s.last_change_tick if (n == s.nozzle and b == s.bed) else t %}
  {% set mins = [printer.save_variables.variables.heater_idle_minutes|default(30)|float(30), 5]|max %}
  SET_GCODE_VARIABLE MACRO=_HEATER_IDLE_STATE VARIABLE=tick VALUE={t}
  SET_GCODE_VARIABLE MACRO=_HEATER_IDLE_STATE VARIABLE=nozzle VALUE={n}
  SET_GCODE_VARIABLE MACRO=_HEATER_IDLE_STATE VARIABLE=bed VALUE={b}
  SET_GCODE_VARIABLE MACRO=_HEATER_IDLE_STATE VARIABLE=last_change_tick VALUE={last}
  {% if printer.idle_timeout.idle_timeout != mins * 60 %}
    SET_IDLE_TIMEOUT TIMEOUT={mins * 60}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_HEATER_IDLE_TICK DURATION=30

[gcode_macro HEATER_IDLE_TIMEOUT]
description: Show or set the minutes with no print and no heater change before the heaters go off (30 = stock, at least 5)
gcode:
  {% if 'MINUTES' not in params %}
    RESPOND TYPE=echo MSG="Heater idle timeout: {(printer.idle_timeout.idle_timeout / 60)|round(1)} min"
  {% else %}
    {% set m = params.MINUTES|float(-1) %}
    {% if m < 5 %}
      {action_raise_error("HEATER_IDLE_TIMEOUT: MINUTES must be a number, 5 or more")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=heater_idle_minutes VALUE={m}
    SET_IDLE_TIMEOUT TIMEOUT={m * 60}
    RESPOND TYPE=echo MSG="Heater idle timeout set to {m} min: heaters off after that long with no print and no heater change"
  {% endif %}

[display_status]

[exclude_object]

[gcode_arcs]
resolution: 1

# G10/G11 and SET_RETRACTION (slicers with "use firmware retraction", e.g.
# the zMod/Bambufy AD5X profiles). Stock has no firmware retraction; these
# are zMod's values, which files sliced for zMod printed with (their
# profiles say 1.4 mm at 35 mm/s, but zMod's firmware applied 0.7). Change
# in local.cfg or per file with SET_RETRACTION.
[firmware_retraction]
retract_length: 0.7
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[respond]

# Klipper has no M900. Same mapping as stock.
[gcode_macro M900]
description: Set pressure advance (Marlin style)
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

#####################################################################
# Setup wizard (its tuning results replace the PID and input shaper
# values above)
#####################################################################

[include setup.cfg]

#####################################################################
# The printer's editable macros (user space, docs/config-layout.md):
# PRINT_START with a mesh of the print area every print, the prime line,
# quick actions, swap templates beyond stock. Copied from the image's
# templates (/usr/share/ad5x/defaults/macros) at first boot; an update
# that changes a template replaces the file and keeps an edited one as
# <name>.cfg.bak-<date> (CONFIG_BACKUPS lists them). Read in name order;
# a section already defined above is merged (a macro's gcode: replaces
# ours). No macros directory: stock behaviour, no error. Lasting personal
# changes belong in local.cfg, read after everything.
#####################################################################

# Notices about replaced macros files, CONFIG_BACKUPS (ad5x_config.py).
[ad5x_config]
#config_dir: /home/klipper/printer_data/config

[include /home/klipper/printer_data/config/macros/*.cfg]

#####################################################################
# Plugins (last: they may change anything above; unit.cfg and local.cfg,
# read after this file, still win). docs/plugins.md
#####################################################################

# ENABLE_PLUGIN / DISABLE_PLUGIN / LIST_PLUGINS, and the plugins' Python
# extras. Must come before the plugins' own sections (the include below).
[ad5x_plugins]
#plugins_file: /home/klipper/printer_data/config/plugins.cfg
#shipped_dir: /usr/share/ad5x/plugins
#user_dir: /data/ad5x/plugins

# The printer's own list of enabled plugins (a first boot or an update
# writes it once; the system never changes it after that). The [s] makes
# it a pattern: no file, no error.
[include /home/klipper/printer_data/config/plugin[s].cfg]

# This printer's nozzle size (SET_NOZZLE_SIZE: the setup wizard, Settings
# on the touch screen): nozzle.cfg in the config folder, after the factory
# [extruder] above (0.4 mm), before unit.cfg and local.cfg. The pattern
# skips it while there is none.
[ad5x_nozzle]
[include /home/klipper/printer_data/config/nozzl[e].cfg]
