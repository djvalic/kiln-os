# macros/quick_actions.cfg: screen quick actions and console shortcuts
# (Kiln OS).
#
# Editable defaults (docs/config-layout.md; header of print_start.cfg).
# An update with a new version replaces this file and keeps an edited copy
# as quick_actions.cfg.bak-<date> (CONFIG_BACKUPS). Changes that must
# survive updates go in local.cfg.
#
# zMod's macro names: HelixScreen's AD5X preset buttons call LOAD_FILAMENT,
# UNLOAD_FILAMENT, CLEAR_NOZZLE and AUTO_FULL_BED_LEVEL. Not stock (the
# stock UI did these itself).

[gcode_macro _HEAT_FOR_FILAMENT]
gcode:
  {% if printer.extruder.target < printer.configfile.settings.extruder.min_extrude_temp %}
    M109 S{params.TEMP|default(220)|float}
  {% else %}
    M109 S{printer.extruder.target}
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Heat (220 C unless set) and extrude 30 mm
gcode:
  _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(220)}
  # Puts back the print's extrusion mode (M82 or M83), also during a print
  SAVE_GCODE_STATE NAME=load_filament
  M83
  G1 E30 F300
  RESTORE_GCODE_STATE NAME=load_filament MOVE=0

[gcode_macro UNLOAD_FILAMENT]
description: Cut and unload the IFS lane in the toolhead, or retract 50 mm
gcode:
  # The lane in the nozzle: Kiln's record (ifs_loaded), else the lane the IFS
  # points at when loaded_channels says it holds filament (a load under zMod
  # leaves ifs_loaded unset, issue #13). IFS_UNLOAD checks the toolhead sensor
  {% set chan = printer.ifs.channel if 'ifs' in printer else 0 %}
  {% if not chan and 'ifs' in printer and printer.ifs.active_channel in printer.ifs.loaded_channels %}
    {% set chan = printer.ifs.active_channel %}
  {% endif %}
  {% if chan > 0 %}
    IFS_UNLOAD SLOT={chan}
  {% else %}
    _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(220)}
    SAVE_GCODE_STATE NAME=unload_filament
    M83
    G1 E-50 F600
    RESTORE_GCODE_STATE NAME=unload_filament MOVE=0
  {% endif %}

[gcode_macro CLEAR_NOZZLE]
description: Move to the purge box and brush the nozzle (no purge, no heating)
gcode:
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _PURGE_BOX
  G1 Z5 F600
  _NOZZLE_BRUSH
  _NOZZLE_BRUSH

[gcode_macro AUTO_FULL_BED_LEVEL]
description: Full bed mesh at stock's levelling temperatures, then save
gcode:
  {% set bed = params.BED|default(60)|float %}
  M140 S{bed}
  M104 S140
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 X107.5 Y107.5 Z10 F6000
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  M109 S140
  BED_MESH_CALIBRATE
  M104 S0
  M140 S0
  SAVE_CONFIG

# Run the setup wizard again on the touch screen (docs/setup-wizard.md).
[gcode_macro SETUP_WIZARD]
description: Run the setup wizard again on the touch screen
gcode:
  SETUP_WIZARD_STEP ACTION=wizard
