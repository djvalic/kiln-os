# macros/quick_actions.cfg: screen quick actions and console shortcuts
# (Kiln OS).
#
# Editable defaults (docs/config-layout.md; header of print_start.cfg).
# An update with a new version replaces this file and keeps an edited copy
# as quick_actions.cfg.bak-<date> (CONFIG_BACKUPS). Changes that must
# survive updates go in local.cfg.
#
# zMod's macro names: HelixScreen's AD5X preset buttons call LOAD_FILAMENT,
# UNLOAD_FILAMENT, CLEAR_NOZZLE and AUTO_FULL_BED_LEVEL. Not stock (the
# stock UI did these itself).

[gcode_macro _HEAT_FOR_FILAMENT]
gcode:
  {% if printer.extruder.target < printer.configfile.settings.extruder.min_extrude_temp %}
    M109 S{params.TEMP|default(220)|float}
  {% else %}
    M109 S{printer.extruder.target}
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Heat (220 C unless set) and extrude 30 mm
gcode:
  _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(220)}
  # Puts back the print's extrusion mode (M82 or M83), also during a print
  SAVE_GCODE_STATE NAME=load_filament
  M83
  G1 E30 F300
  RESTORE_GCODE_STATE NAME=load_filament MOVE=0

[gcode_macro UNLOAD_FILAMENT]
description: Cut and unload the IFS lane in the toolhead, or retract 50 mm
gcode:
  # The lane in the nozzle: Kiln's record (ifs_loaded), else the lane the IFS
  # points at when loaded_channels says it holds filament (a load under zMod
  # leaves ifs_loaded unset, issue #13). IFS_UNLOAD checks the toolhead sensor.
  # HOME=1: an idle printer that isn't homed homes first (as CLEAR_NOZZLE
  # here, and zMod's IFS unload, _IFS_REMOVE_CURRENT_PRUTOK); never during a
  # print or a pause, then IFS_UNLOAD stops with "home the printer first".
  # A strand left in the tube above the toolhead sensor by an unload or slot
  # search that didn't finish (printer.ifs.tube_blocked): nothing to unload
  # here, and no retract either; the error says how to clear it.
  {% if 'ifs' in printer and printer.ifs.tube_blocked|default(false) %}
    {action_raise_error("UNLOAD_FILAMENT: filament sits in the tube above the toolhead sensor (an unload or slot search that did not finish): IFS_FIND_HEAD_SLOT SLOT=n (the slot it is from) pulls it back; pulled out by hand: IFS_SET_CHANNEL CHANNEL=0")}
  {% endif %}
  {% set chan = printer.ifs.channel if 'ifs' in printer else 0 %}
  {% if not chan and 'ifs' in printer and printer.ifs.active_channel in printer.ifs.loaded_channels %}
    {% set chan = printer.ifs.active_channel %}
  {% endif %}
  {% if chan > 0 %}
    IFS_UNLOAD SLOT={chan} HOME=1
  {% else %}
    _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(220)}
    SAVE_GCODE_STATE NAME=unload_filament
    M83
    G1 E-50 F600
    RESTORE_GCODE_STATE NAME=unload_filament MOVE=0
  {% endif %}

[gcode_macro CLEAR_NOZZLE]
description: Move to the purge box and brush the nozzle (no purge, no heating)
gcode:
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _PURGE_BOX
  G1 Z5 F600
  _NOZZLE_BRUSH
  _NOZZLE_BRUSH

[gcode_macro AUTO_FULL_BED_LEVEL]
description: Full bed mesh at stock's levelling temperatures, then save
gcode:
  {% set bed = params.BED|default(60)|float %}
  M140 S{bed}
  M104 S140
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 X107.5 Y107.5 Z10 F6000
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  M109 S140
  BED_MESH_CALIBRATE
  M104 S0
  M140 S0
  SAVE_CONFIG

# Bed screw levelling (issue #69), zMod's name, parameters and defaults:
# nozzle to 130 (no ooze, residue soft), bed to 80 (it expands as it
# heats), 0 leaves that heater off. Homes if needed, then
# SCREWS_TILT_CALCULATE (ad5x.cfg: tares over the first screw, one
# touch there not used, tares again, probes over each screw, prints the
# turns; Fluidd and HelixScreen show them too); DIRECTION=CW|CCW is
# passed on. Ends with the nozzle over the bed centre, 50 mm up, clear of
# the screws. The heaters stay on for the next run after you turn the
# screws (as zMod; the heater idle timeout turns them off). Afterwards
# make a new mesh (AUTO_FULL_BED_LEVEL): the saved one and the saved
# centre Z no longer fit the bed.
[gcode_macro BED_LEVEL_SCREWS_TUNE]
description: Heat (bed 80, nozzle 130 unless set), probe at each bed screw and show how far to turn it
gcode:
  {% set bed = params.BED_TEMP|default(80)|float(-1) %}
  {% set ext = params.EXTRUDER_TEMP|default(130)|float(-1) %}
  {% set dir = params.DIRECTION|default('')|upper %}
  {% set bed_max = printer.configfile.settings.heater_bed.max_temp %}
  {% set ext_max = printer.configfile.settings.extruder.max_temp %}
  {% set th = printer.toolhead %}
  {% set box = printer['gcode_macro _PURGE_BOX_POS'] %}
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    {action_raise_error("BED_LEVEL_SCREWS_TUNE: not during a print")}
  {% endif %}
  {% if bed < 0 or bed > bed_max %}
    {action_raise_error("BED_LEVEL_SCREWS_TUNE: BED_TEMP=%s is not a bed temperature (0 to %d)" % (params.BED_TEMP, bed_max))}
  {% endif %}
  {% if ext < 0 or ext > ext_max %}
    {action_raise_error("BED_LEVEL_SCREWS_TUNE: EXTRUDER_TEMP=%s is not a nozzle temperature (0 to %d)" % (params.EXTRUDER_TEMP, ext_max))}
  {% endif %}
  {% if dir not in ['', 'CW', 'CCW'] %}
    {action_raise_error("BED_LEVEL_SCREWS_TUNE: DIRECTION must be CW or CCW")}
  {% endif %}
  BED_MESH_CLEAR
  {% if bed > 0 %}
    M140 S{bed}
  {% endif %}
  {% if ext > 0 %}
    M104 S{ext}
  {% endif %}
  G90
  {% if 'xyz' not in th.homed_axes %}
    G28
  {% elif th.position.y > 220 + box.dy %}
    # In the purge box: out the way _PURGE_BOX went in
    G1 Y{220 + box.dy} F3000
  {% endif %}
  G1 X107.5 Y107.5 Z10 F6000
  {% if bed > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  {% endif %}
  {% if ext > 0 %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ext - 2} MAXIMUM={ext + 3}
  {% endif %}
  {% if ext == 0 %}
    RESPOND MSG="Nozzle not heated: plastic left on a cold tip can make a screw read wrong (EXTRUDER_TEMP=130, the default, softens it)"
  {% endif %}
  SCREWS_TILT_CALCULATE{% if dir %} DIRECTION={dir}{% endif %}
  G1 Z50 F600
  G1 X107.5 Y107.5 F6000
  RESPOND MSG="Turn the screws as shown (00:15 = a quarter turn), then run BED_LEVEL_SCREWS_TUNE again. When all are close, make a new mesh: AUTO_FULL_BED_LEVEL"

# Run the setup wizard again on the touch screen (docs/setup-wizard.md).
[gcode_macro SETUP_WIZARD]
description: Run the setup wizard again on the touch screen
gcode:
  SETUP_WIZARD_STEP ACTION=wizard
