# macros/prime_line.cfg: prime line before the print (Kiln OS).
#
# Editable defaults (docs/config-layout.md; header of print_start.cfg).
# An update with a new version replaces this file and keeps an edited copy
# as prime_line.cfg.bak-<date> (CONFIG_BACKUPS). Changes that must survive
# updates go in local.cfg, e.g.
#   [gcode_macro _PRIME_LINE]
#   variable_prime: 10
# prime_line: 0 there turns the line off.

# Not stock (zMod's LINE_PURGE, which this printer used). After the purge
# at the box PRINT_START retracts (its variable_retract, 3 mm), cools the
# nozzle for the brush and the Z check/mesh, and reheats at Z50: the
# nozzle is partly empty and has oozed. This puts the retract back
# (unretract), refills the nozzle in place (prime: a small puddle that
# anchors the line), draws a slow, wide line just in front of the first
# layer's objects (slicer object labels via [exclude_object]; at the front
# edge without them; along the left or right of the objects when they
# reach the front edge), then wipes on along the line's direction and
# lifts. PRINT_START runs it when no tool load purged the nozzle; FORCE=1
# draws it whatever prime_line says (zMod's LINE_PURGE).
#
# Line cross-section: width x height, width 0 = 2.5 x the nozzle
# ([extruder] nozzle_diameter: 1.5 mm for 0.6, 1.0 mm for 0.4); flow
# scales the extrusion. Defaults on a 0.6 nozzle: 3 + 8 mm in place, then
# about 11 mm of filament over 60 mm at 10 mm/s (4.5 mm3/s).
[gcode_macro _PRIME_LINE]
description: Prime line in front of the print area (FORCE=1: even when prime_line is 0)
variable_prime_line: 1
# mm along X (or Y beside the objects)
variable_length: 60
# mm above the bed
variable_height: 0.3
# mm; 0 = 2.5 x nozzle_diameter
variable_width: 0
# extrusion multiplier for the line
variable_flow: 1.0
# mm/min while drawing the line
variable_speed: 600
# mm of retraction the start left (PRINT_START sets it after the box purge, or
# the IFS purge leaves it); put back first, then cleared. _PRINT_START_END
# puts it back when this line doesn't draw.
variable_owed: 0
# mm extruded in place at the start of the line, and its speed (mm/min)
variable_prime: 8
variable_prime_speed: 150
# mm between the line and the objects
variable_gap: 5
# mm: keep the line this far inside the plate edges
variable_margin: 2
# mm moved on without extruding at the end (wipe), then retract (mm)
variable_wipe: 10
variable_retract: 0.5
gcode:
  {% if prime_line or params.FORCE|default(0)|int %}
    {% set nd = printer.configfile.settings.extruder.nozzle_diameter|float %}
    {% set w = width if width > 0 else nd * 2.5 %}
    {% set th = printer.toolhead %}
    # The plate: 0..axis maximum - 10 (220 x 220 on the AD5X), less margin
    {% set px0 = [th.axis_minimum.x, 0]|max + margin + w / 2 %}
    {% set py0 = [th.axis_minimum.y, 0]|max + margin + w / 2 %}
    {% set px1 = th.axis_maximum.x - 10 - margin - w / 2 %}
    {% set py1 = th.axis_maximum.y - 10 - margin - w / 2 %}
    {% set objs = printer.exclude_object.objects|default([]) %}
    {% set xs = [] %}
    {% set ys = [] %}
    {% for o in objs %}
      {% for pt in o.polygon|default([]) %}
        {% set _ = xs.append(pt[0]) %}
        {% set _ = ys.append(pt[1]) %}
      {% endfor %}
    {% endfor %}
    {% set clear = gap + w / 2 %}
    {% set axis = 'X' %}
    {% set ok = True %}
    {% if not xs %}
      # No object labels: along the front edge
      {% set x0 = 20 %}
      {% set y = py0 %}
    {% elif ys|min - clear >= py0 %}
      # In front of the objects
      {% set y = ys|min - clear %}
      {% set x0 = [[xs|min, px0]|max, px1 - length]|min %}
    {% elif xs|min - clear >= px0 %}
      # Objects reach the front: along their left side
      {% set axis = 'Y' %}
      {% set x = xs|min - clear %}
      {% set y0 = [[ys|min, py0]|max, py1 - length]|min %}
    {% elif xs|max + clear <= px1 %}
      # ... or their right side
      {% set axis = 'Y' %}
      {% set x = xs|max + clear %}
      {% set y0 = [[ys|min, py0]|max, py1 - length]|min %}
    {% else %}
      {% set ok = False %}
    {% endif %}
    {% if ok %}
      {% if axis == 'X' %}
        {% set len = [length, px1 - x0]|min %}
        {% set sx, sy = x0, y %}
        {% set ex, ey = x0 + len, y %}
        {% set wx, wy = [x0 + len + wipe, px1 + w / 2 + margin]|min, y %}
      {% else %}
        {% set len = [length, py1 - y0]|min %}
        {% set sx, sy = x, y0 %}
        {% set ex, ey = x, y0 + len %}
        {% set wx, wy = x, [y0 + len + wipe, py1 + w / 2 + margin]|min %}
      {% endif %}
      # Filament length: line volume / filament cross-section
      {% set fd = printer.configfile.settings.extruder.filament_diameter|float %}
      {% set e = len * height * w * flow / (3.14159 * fd * fd / 4) %}
      SET_GCODE_VARIABLE MACRO=_PRIME_LINE VARIABLE=owed VALUE=0
      _PRINT_STATUS MSG="Prime line"
      G90
      M83
      G1 X{sx|round(2)} Y{sy|round(2)} F12000
      G1 Z{height} F1000
      {% if owed > 0 %}
      G1 E{owed} F1800
      {% endif %}
      G1 E{prime} F{prime_speed}
      G1 X{ex|round(2)} Y{ey|round(2)} E{e|round(3)} F{speed}
      G1 X{wx|round(2)} Y{wy|round(2)} F3000
      G1 E-{retract} F1800
      G1 Z{height + 1} F1000
      M82
      G92 E0
    {% else %}
      RESPOND TYPE=error MSG="Prime line skipped: the objects leave no room on the plate"
    {% endif %}
  {% endif %}
