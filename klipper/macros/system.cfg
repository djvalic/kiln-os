# macros/system.cfg: buttons for the system commands (Kiln OS).
#
# Editable defaults (docs/config-layout.md; header of print_start.cfg).
# An update with a new version replaces this file and keeps an edited copy
# as system.cfg.bak-<date> (CONFIG_BACKUPS). Changes that must survive
# updates go in local.cfg.
#
# Fluidd's macro panel lists only gcode_macro sections, not the commands of
# Klipper modules; these wrappers put plugins, IFS tuning and the update
# backups there (Fluidd category "System"). Each one just runs the command.
# The IFS ones stop with a message while Kiln's IFS module is off ([ifs]
# enable: False, set by a plugin that drives the IFS; docs/plugin-api.md).

[gcode_macro PLUGINS_LIST]
description: List the plugins and which are enabled (LIST_PLUGINS)
gcode:
  LIST_PLUGINS

[gcode_macro PLUGIN_ENABLE]
description: Enable a plugin by name, then restart Klipper (ENABLE_PLUGIN)
gcode:
  {% set name = params.NAME|default("")|string %}
  {% if not name %}
    { action_raise_error("PLUGIN_ENABLE: give NAME= (PLUGINS_LIST shows the names)") }
  {% endif %}
  ENABLE_PLUGIN NAME={name}

[gcode_macro PLUGIN_DISABLE]
description: Disable a plugin by name, then restart Klipper (DISABLE_PLUGIN)
gcode:
  {% set name = params.NAME|default("")|string %}
  {% if not name %}
    { action_raise_error("PLUGIN_DISABLE: give NAME= (PLUGINS_LIST shows the names)") }
  {% endif %}
  DISABLE_PLUGIN NAME={name}

[gcode_macro IFS_TUNE_RUN]
description: Tune IFS swaps: feed speed, load distances, unload length (IFS_TUNE; CHANNEL= for one slot)
gcode:
  {% if 'ifs' not in printer %}
    { action_raise_error("IFS_TUNE_RUN: Kiln's IFS module is off ([ifs] enable: False: a plugin drives the IFS)") }
  {% endif %}
  {% set channel = params.CHANNEL|default(0)|int %}
  IFS_TUNE{" CHANNEL=%d" % channel if channel else ""}

[gcode_macro IFS_TUNE_CLEAR]
description: Forget the IFS tuning, back to the defaults (IFS_TUNE_RESET)
gcode:
  {% if 'ifs' not in printer %}
    { action_raise_error("IFS_TUNE_CLEAR: Kiln's IFS module is off ([ifs] enable: False: a plugin drives the IFS)") }
  {% endif %}
  IFS_TUNE_RESET

[gcode_macro IFS_INFO]
description: IFS status: slots, filament, loaded slot (IFS_STATUS)
gcode:
  {% if 'ifs' not in printer %}
    { action_raise_error("IFS_INFO: Kiln's IFS module is off ([ifs] enable: False: a plugin drives the IFS)") }
  {% endif %}
  IFS_STATUS

[gcode_macro CONFIG_BACKUPS_SHOW]
description: Macro files replaced by updates and their backups (CONFIG_BACKUPS; ACK=1 clears the notice)
gcode:
  {% set ack = params.ACK|default(0)|int %}
  CONFIG_BACKUPS{" ACK=1" if ack else ""}
