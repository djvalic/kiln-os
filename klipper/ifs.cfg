# AD5X IFS for mainline Klipper — sample config for klipper/extras/ifs.py
#
# Defaults below are the stock software's own defaults (firmwareExe writes
# them to /usr/prog/config/Adventurer5M.json when the file is missing). Values
# marked TODO are per-printer: read this printer's file in Phase 3.
# Templates must not call IFS_* commands: the module holds the IFS link
# while they run.

[save_variables]
filename: /home/klipper/printer_data/config/variables.cfg

[ifs]
serial: /dev/ttyS4
baud: 115200
# IFS move lengths and speeds, as the stock software sends them.
load_length: 1000
load_speed: 1200
unload_length: 60   # stock swap sends F11 L60
unload_speed: 600   # stock UnloadSpeed
backoff_length: 50
load_retries: 3   # stock re-sends a stuck load up to 3 times
# Loads stop when the toolhead sensor sees filament: the module sends F112
# (stop feeding), as stock does. load_length is then only an upper limit.
# Stock band: present at <= 0.30 or >= 0.72. TODO: check on the printer
# with GET_FILAMENT_VALUE, with and without filament in the toolhead.
head_sensor: temperature_sensor filamentValue
head_sensor_present_below: 0.30
head_sensor_present_above: 0.72
# First purge stage: after loading, the IFS and the extruder both feed
# push_length mm at push_speed mm/min (stock: 90 mm at a per-material speed).
push_length: 90
push_speed: 300   # stock FristESpeed
# After the toolhead is clear, pull the old strand back further (stock
# F11 L70 S1200, "UnloadIFSSpace").
retract_length: 70
retract_speed: 1200
# Flush after the push, per round (stock 90 mm at 300 mm/min = 12 mm3/s).
# IFS_PURGE_TEST measures what a colour change really needs and
# IFS_SET_FLUSH saves it (ifs_flush in variables.cfg); swaps then purge one
# round of it. A bigger nozzle can flush faster: local.cfg sets
# flush_speed for this printer's 0.6 mm nozzle.
#flush_length: 90
#flush_speed: 300
# Purge rounds per swap; each round extrudes push_length + flush_mm.
# 0 = from the spool colours like stock (set them with
# IFS_SET_COLOR CHANNEL=1 COLOR=FF0000): 2 rounds when the slicer flush
# volume formula gives more than purge_volume_threshold, else 1, and 2 when
# a colour is unknown. Loading into an empty toolhead: 1.
purge_rounds: 0
purge_volume_threshold: 400
# True reproduces the stock app's colour byte mix-up (black to white gets 1
# round, red to blue 2). See docs/deviations-from-stock.md.
stock_color_quirk: False
# Seconds to wait for the IFS to return to ready after each move.
select_timeout: 30
load_timeout: 60
unload_timeout: 60
release_timeout: 30
# Background F13/F21 poll for printer.ifs status (0 disables).
status_interval: 5
# Swap tuning (IFS_TUNE, QuickSwap-like; the setup wizard runs it): the
# measured feed speed, each slot's load distance and the unload length are
# saved in variables.cfg (ifs_speed, ifs_load_dist_<n>, ifs_unload_dist,
# ifs_tube_unload) and replace load_speed/unload_length/retract_length in
# swaps. IFS_TUNE_RESET goes back to the values here.
#tune_max_speed: 3000
#tune_load_margin: 20
# Sensor-checked purge (not stock): one purge round per swap; after the
# push the extruder feeds purge_confirm mm in purge_step steps, checking
# the toolhead sensor each time, then purge_gcode flushes purge_finish mm
# (both scaled by nozzle diameter / 0.4). Much less purge than stock:
# colour changes need the slicer's flush (prime tower) instead.
#sensor_purge: False
#purge_step: 5
#purge_confirm: 15
#purge_finish: 15
# Swaps without purge, for prints whose slicer purges (prime tower or its
# own flush at the box; zMod's use_trash_on_print 0 / 2): the nopoop plugin
# sets purge_mode_variable: use_trash_on_print, and in a print such a swap
# only feeds prime_length mm past the toolhead sensor to fill the nozzle,
# then runs prime_gcode. Thin first tower lines: raise prime_length; blobs
# on the tower: lower it. IFS_SWAP PURGE=0|1 picks it for one swap.
#purge_mode_variable: use_trash_on_print
#prime_length: 12
# Auto-refill (not stock, off until switched on): when the slot in use
# runs empty in a print, the print pauses, swaps to another slot with the
# same material and colour (types set on the screen or IFS_SET_MATERIAL;
# colours within refill_color_tolerance), points the tools at it and
# resumes. IFS_AUTO_REFILL ENABLE=1 switches it on (kept in variables.cfg).
# Without a matching slot the print pauses at the toolhead sensor as before,
# and a print that loads a slot with no backup says so (no pause).
# refill_match: exact (the same colour code), similar (colours within
# refill_color_tolerance, RGB distance 0-441) or any (the material
# decides); IFS_AUTO_REFILL MATCH= changes it (kept in variables.cfg).
# A spool put in during a print is pre-fed when a refill picks it.
#auto_refill: False
#refill_match: similar
#refill_color_tolerance: 40
#refill_poll: 1
# IFS_EJECT: pull a lane out of the IFS (TODO: measure the tube length).
eject_length: 1000
eject_speed: 1200
eject_timeout: 120
# IFS_LOAD/IFS_UNLOAD/IFS_EJECT/IFS_SWAP/T0-T3 heat only when the nozzle
# target is below min_extrude_temp (idle): to the slot material's
# temperature (PLA 220, PETG 250, ...; override per type, e.g. temp_pla:
# 215), else default_temp; TEMP= forces one. The old target is restored.
default_temp: 220
# New spools, as stock at power-on: each channel the IFS flags as newly
# inserted is fed up to 600 mm (stopped by the IFS or the toolhead sensor,
# then backed off 100 mm), acknowledged and released. Runs when Klipper
# starts and when the status poll sees a new spool, never while printing;
# the loaded channel is only acknowledged. IFS_PREFEED CHANNEL=n by hand.
prefeed_on_insert: True
#prefeed_length: 600
#prefeed_speed: 1200
#prefeed_backoff: 100

# The swap templates below follow the stock sequence as recorded from the
# stock app under qemu (docs/ifs-swap-capture.md). Templates beyond stock
# are in the printer's macros/ifs_templates.cfg; a later [ifs] section
# there (or in local.cfg) replaces a whole template. Purge box: back left,
# X 52.5 / Y 229 plus the per-printer offsets; brush strokes run Y 229 <-> 220.
# Templates must not call IFS_* commands (the module holds the IFS link).

# Runs first on every swap: save state, lift 5 mm (stock).
before_gcode:
  M400
  SAVE_GCODE_STATE NAME=ifs_swap
  # The G-code state doesn't include the part fan: keep it for the end.
  SET_GCODE_VARIABLE MACRO=_IFS_STATE VARIABLE=fan VALUE={printer['fan_generic fanM106'].speed}
  # The toolhead runs empty during a swap: don't let runout pause the print.
  # Its enable state is kept in _IFS_STATE and put back after the swap.
  {% if 'filament_switch_sensor toolhead' in printer %}
    SET_GCODE_VARIABLE MACRO=_IFS_STATE VARIABLE=sensor_on VALUE={1 if printer['filament_switch_sensor toolhead'].enabled else 0}
    SET_FILAMENT_SENSOR SENSOR=toolhead ENABLE=0
  {% endif %}
  G91
  G1 Z5 F800
  G90
  M400

# Stock cutter move: the toolhead pushes the cutter lever at the cut
# position and the extruder backs off 5 mm; then it goes to the purge box,
# where the old strand is unloaded. Cut position = per-printer
# CutXOffset/CutYOffset minus 2.5 / 7.5 mm (stock defaults 0: X -2.5, Y -7.5).
# Per-printer values: [gcode_macro _AD5X_UNIT] in unit.cfg.
cut_gcode:
  {% set unit = printer['gcode_macro _AD5X_UNIT'] %}
  {% set cut_x_offset = unit.cut_x_offset %}
  {% set cut_y_offset = unit.cut_y_offset %}
  {% set x_off = printer['gcode_macro _AD5X_UNIT'].x_offset %}
  {% set y_off = printer['gcode_macro _AD5X_UNIT'].y_offset %}
  G90
  G1 Y10 F18000
  G1 Y{cut_y_offset - 7.5} F1800
  G1 X20 F12000
  G1 X{cut_x_offset - 2.5} F600
  M400
  M83
  G1 E-5 F600
  M400
  G90
  G1 X{52.5 + x_off} F12000
  G1 Y220 F12000
  G1 Y{229 + y_off} F3000
  M400

# Runs as the IFS starts pulling the old strand back: the extruder retracts
# at the same time (stock UnloadESpace 60 at UnloadSpeed 600). LENGTH is
# unload_length, or the unload length IFS_TUNE measured.
unload_gcode:
  M83
  G1 E-{params.LENGTH|default(60)} F{params.SPEED|default(600)}

# Start of each purge round: at the purge box, fan off. The module then
# pushes push_length on the IFS and the extruder together and releases the
# IFS. params.ROUND is the round number (1..params.ROUNDS).
purge_start_gcode:
  {% set x_off = printer['gcode_macro _AD5X_UNIT'].x_offset %}
  {% set y_off = printer['gcode_macro _AD5X_UNIT'].y_offset %}
  G90
  G1 X{52.5 + x_off} F12000
  G1 Y{229 + y_off} F3000
  M400
  M106 S0

# Rest of each purge round, as stock: fan on, wipe, back into the box, fan
# off, flush, fan on, retract, wipe. The 3 s pauses are stock's.
purge_gcode:
  {% set x_off = printer['gcode_macro _AD5X_UNIT'].x_offset %}
  {% set y_off = printer['gcode_macro _AD5X_UNIT'].y_offset %}
  {% set purge_x = 52.5 + x_off %}
  {% set purge_y = 229 + y_off %}
  # stock sent 90 (sized from the colours); FLUSH= from sensor_purge
  # FLUSH: flush_length (stock 90), the measured ifs_flush, or the
  # sensor-checked finish. FLUSH_SPEED: flush_speed (stock 300).
  {% set flush_mm = params.FLUSH|default(90)|float %}
  {% set flush_speed = params.FLUSH_SPEED|default(300)|float %}
  {% set wipe_fan = 125 %}      # stock fan speed while wiping
  M400
  M106 S{wipe_fan}
  G4 P3000
  G90
  G1 Y220 F12000
  G1 Y{purge_y} F3000
  G1 Y220 F12000
  G1 Y{purge_y} F3000
  G1 Y220 F12000
  G1 X{purge_x} F12000
  G1 Y{purge_y} F3000
  M400
  M106 S0
  G4 P3000
  M83
  G1 E{flush_mm} F{flush_speed}
  M400
  M106 S{wipe_fan}
  G4 P3000
  G1 E-3 F300
  M400
  G90
  G1 Y220 F12000
  G1 Y{purge_y} F3000
  G1 Y220 F12000
  G1 Y{purge_y} F3000
  G1 Y220 F12000
  M400

# Swap without purge (not stock: the nopoop plugin's modes, IFS_SWAP
# PURGE=0) runs prime_gcode after the prime feed. It is in the printer's
# macros/ifs_templates.cfg (docs/config-layout.md); without it nothing runs.

# After the last round: restore the print's fan, sensor and position.
after_gcode:
  M106 S{(printer["gcode_macro _IFS_STATE"].fan * 255)|round|int}
  {% if 'filament_switch_sensor toolhead' in printer %}
    SET_FILAMENT_SENSOR SENSOR=toolhead ENABLE={printer["gcode_macro _IFS_STATE"].sensor_on}
  {% endif %}
  RESTORE_GCODE_STATE NAME=ifs_swap MOVE=1 MOVE_SPEED=200

# A swap failed or was stopped after before_gcode ran: put back the sensor,
# fan and G-code state, as after_gcode does, but without the move (a move
# mid-print could hit the part). Runs only when before_gcode ran.
abort_gcode:
  M106 S{(printer["gcode_macro _IFS_STATE"].fan * 255)|round|int}
  {% if 'filament_switch_sensor toolhead' in printer %}
    SET_FILAMENT_SENSOR SENSOR=toolhead ENABLE={printer["gcode_macro _IFS_STATE"].sensor_on}
  {% endif %}
  RESTORE_GCODE_STATE NAME=ifs_swap MOVE=0

# Holds the print's part fan speed and the toolhead sensor's enable state
# across a swap.
[gcode_macro _IFS_STATE]
variable_fan: 0
variable_sensor_on: 1
gcode:

# Slicer tool changes T0-T3 load the channel the tool map names: 1-4 unless
# IFS_MAP_TOOL TOOL=n SLOT=m changed it (per print: reset when it ends).
# For colour-sized purges, give the module the spool colours, e.g. in the
# slicer's start G-code (OrcaSlicer placeholders; the quotes keep the '#'
# from starting a comment):
#   IFS_SET_COLOR CHANNEL=1 COLOR="{filament_colour[0]}"
#   IFS_SET_COLOR CHANNEL=2 COLOR="{filament_colour[1]}"
# IFS_SET_MATERIAL SLOT=n TYPE=PLA COLOR=RRGGBB sets type and colour.
[gcode_macro T0]
gcode: IFS_SWAP CHANNEL={printer.ifs.tool_map["0"]}
[gcode_macro T1]
gcode: IFS_SWAP CHANNEL={printer.ifs.tool_map["1"]}
[gcode_macro T2]
gcode: IFS_SWAP CHANNEL={printer.ifs.tool_map["2"]}
[gcode_macro T3]
gcode: IFS_SWAP CHANNEL={printer.ifs.tool_map["3"]}

# Purge tuning: how much flush a colour change needs on this hotend.
# Swaps FROM -> TO with no flush (only the stock push), then prints COUNT
# dots of STEP mm each along the front of the bed, left to right. The first
# dot fully in the new colour is the answer:
#   IFS_PURGE_TEST FROM=1 TO=2        (dark FROM, light TO is the hard case)
#   IFS_PURGE_RESULT DOT=6            (saves 6 x STEP as the flush)
[gcode_macro IFS_PURGE_TEST]
description: Purge tuning: swap FROM= -> TO= without flush, then a row of dots (STEP= mm each, COUNT=) on the bed front
variable_step: 10
gcode:
  {% set from_ch = params.FROM|int %}
  {% set to_ch = params.TO|int %}
  {% set step = params.STEP|default(10)|float %}
  {% set count = params.COUNT|default(12)|int %}
  {% set temp = params.TEMP|default(220)|float %}
  {% set bed = params.BED|default(60)|float %}
  {% set speed = printer.configfile.settings.ifs.flush_speed|default(300)|float %}
  {% if from_ch == to_ch or from_ch < 1 or to_ch < 1 %}
    { action_raise_error("IFS_PURGE_TEST: give two different slots, FROM= and TO=") }
  {% endif %}
  SAVE_GCODE_STATE NAME=ifs_purge_test
  SET_GCODE_VARIABLE MACRO=IFS_PURGE_TEST VARIABLE=step VALUE={step}
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  M140 S{bed}
  M104 S{temp}
  BED_MESH_PROFILE LOAD=default
  M190 S{bed}
  M109 S{temp}
  {% if printer.ifs.channel != from_ch %}
    IFS_SWAP CHANNEL={from_ch}
  {% endif %}
  IFS_SWAP CHANNEL={to_ch} FLUSH=0 ROUNDS=1
  G90
  M83
  G1 Z5 F1200
  G1 X20 Y20 F12000
  G1 Z0.6 F600
  G1 E3 F300
  {% for i in range(count) %}
    G1 X{20 + i * 14} Y20 F12000
    G1 Z0.6 F600
    G1 E{step} F{speed}
    G1 Z3 F600
  {% endfor %}
  G1 E-2 F1800
  G1 Z10 F600
  G1 X110 Y200 F12000
  M104 S0
  M140 S0
  RESTORE_GCODE_STATE NAME=ifs_purge_test MOVE=0
  RESPOND MSG="Purge test: {count} dots of {step} mm, left to right. Find the first dot fully in the new colour and run IFS_PURGE_RESULT DOT=<number>"

[gcode_macro IFS_PURGE_RESULT]
description: Save the flush from IFS_PURGE_TEST: DOT= (first clean dot, counted from the left)
gcode:
  {% set step = printer['gcode_macro IFS_PURGE_TEST'].step|float %}
  {% if 'DOT' not in params %}
    { action_raise_error("IFS_PURGE_RESULT: give DOT= (the first clean dot, counted from the left)") }
  {% endif %}
  {% set dot = params.DOT|int %}
  IFS_SET_FLUSH LENGTH={dot * step}
