# zmod-compat plugin (plugin.json, README.md).
#
# G-code sliced for zMod (ghzserg/zmod) calls macros zMod defines. This
# plugin gives them the same names and parameters, mapped onto this
# system's own macros (PRINT_START, PRINT_END, the purge box in ifs.cfg).
# Written for this project from zMod's documented behaviour; no zMod code
# copied. Table of commands: docs/zmod-compat.md.
#
# Settings (override in local.cfg, e.g. [gcode_macro START_PRINT]
# variable_line_purge: 0):
#   START_PRINT  line_purge: 1 = zMod's LINE_PURGE after the start (zMod
#                default "clear: LINE_PURGE"), 0 = none
#   END_PRINT    unload_filament: 1 = cut and unload the IFS lane at the
#                end (zMod "remove_filament"), 0 = leave it loaded
#   SET_ACTIVE_SPOOL spoolman: 1 once Moonraker has a [spoolman] section

# zMod's start command (its slicer profiles: START_PRINT EXTRUDER_TEMP=
# BED_TEMP=), run as PRINT_START. Without FORCE_* PRINT_START decides
# (macros/print_start.cfg: a mesh of the print area every print, like
# zMod's print_leveling: 1 with use_kamp: 1; the factory PRINT_START: the
# stock Z check). FORCE_LEVELING=1: new full bed mesh; FORCE_KAMP=1: new
# mesh of the print area only (KAMP). TOOL= (Bambufy's start G-code): load
# that slicer tool at the end of the start. SKIP_LEVELING, MESH, INTERNAL,
# EXTERNAL are accepted and not needed (no chamber fans). Z_OFFSET is
# ignored: the saved Z offset is used, as zMod does with its default
# load_zoffset: 1.
[gcode_macro START_PRINT]
description: zMod print start (EXTRUDER_TEMP= BED_TEMP= [FORCE_LEVELING=] [FORCE_KAMP=] [TOOL=] [SOAK=]), runs PRINT_START
variable_line_purge: 1
gcode:
  # No EXTRUDER_TEMP=/BED_TEMP=: the temperature the file already set (Orca
  # profiles send their own M104/M140 before the start line and may leave
  # them out here), else zMod's defaults 245 / 80. Before, 245 replaced
  # the file's 235 for the whole print when no later M104 came.
  {% set extruder = params.EXTRUDER_TEMP|default(printer.extruder.target if printer.extruder.target > 0 else 245)|float %}
  {% set bed = params.BED_TEMP|default(printer.heater_bed.target if printer.heater_bed.target > 0 else 80)|float %}
  {% if params.EXTRUDER_TEMP is not defined %}
    RESPOND MSG="START_PRINT: no EXTRUDER_TEMP=, nozzle {extruder|int} C ({'set by the file' if printer.extruder.target > 0 else 'zMod default'})"
  {% endif %}
  {% set kamp = params.FORCE_KAMP|default(0)|string|lower in ('1', 'true') %}
  {% set full = params.FORCE_LEVELING|default(0)|string|lower in ('1', 'true') %}
  # TOOL must be a number (or -1), as in PRINT_START. Text such as an
  # unexpanded "[initial_tool]" would turn into 0 and load tool 0 (issue #12).
  {% set raw_tool = params.TOOL|default('-1')|string %}
  {% set tool_ok = raw_tool == '-1' or raw_tool.isdigit() %}
  {% set tool = raw_tool|int if tool_ok else -1 %}
  {% if not tool_ok %}
    RESPOND TYPE=error MSG="PRINT_START: TOOL={raw_tool} is not a tool number, no tool loaded. Use the slicer's expanded value (issue #12)."
  {% endif %}
  {% if params.Z_OFFSET is defined and params.Z_OFFSET|float != 99.0 %}
    RESPOND MSG="START_PRINT: Z_OFFSET={params.Z_OFFSET} ignored, the saved Z offset is used"
  {% endif %}
  {% if 'gcode_macro _NOPOOP' in printer %}
    SET_GCODE_VARIABLE MACRO=_NOPOOP VARIABLE=next VALUE=0
  {% endif %}
  {% set level = '' %}
  {% if kamp %}
    {% set level = 'LEVEL=1 ADAPTIVE=1' %}
  {% elif full %}
    {% set level = 'LEVEL=1 ADAPTIVE=0' %}
  {% endif %}
  {% set soak = 'SOAK=' ~ params.SOAK if 'SOAK' in params else '' %}
  PRINT_START BED={bed} EXTRUDER={extruder} TOOL={tool} {level} {soak}
  {% set pl = printer['gcode_macro _PRIME_LINE'] if 'gcode_macro _PRIME_LINE' in printer else none %}
  {% if line_purge and pl is not none and not pl.prime_line %}
    LINE_PURGE
  {% endif %}
  G90
  M83

# zMod's end command.
[gcode_macro END_PRINT]
description: zMod print end: PRINT_END (optionally unload the IFS lane first)
variable_unload_filament: 0
gcode:
  {% if unload_filament and 'ifs' in printer and printer.ifs.channel
        and 'xyz' in printer.toolhead.homed_axes %}
    IFS_UNLOAD
  {% endif %}
  PRINT_END

# zMod's priming line (its "clear" setting LINE_PURGE, from KAMP): the
# printer's _PRIME_LINE (macros/prime_line.cfg), in front of the objects
# the slicer labelled.
[gcode_macro LINE_PURGE]
description: Prime line in front of the print area
gcode:
  {% if 'gcode_macro _PRIME_LINE' in printer %}
    _PRIME_LINE FORCE=1
  {% else %}
    RESPOND MSG="LINE_PURGE: no prime line (macros/prime_line.cfg is missing)"
  {% endif %}

# Into the purge box (slicer tool-change G-code in "slicer-controlled
# purge" mode). As zMod: X first (leaving the box towards Y 220 if inside
# it), then into the box along Y. Box: X 52.5 / Y 229 plus this printer's
# offset (TRASH_OFFSET, else unit.cfg), the same spot the purge uses.
[gcode_macro _GOTO_TRASH]
description: Move into the purge box
gcode:
  {% set t = printer.save_variables.variables.trash_offset|default({}) %}
  {% set unit = printer['gcode_macro _AD5X_UNIT'] %}
  {% set bx = 52.5 + (t.x if t.x is defined else unit.x_offset|float) %}
  {% set by = 229 + (t.y if t.y is defined else unit.y_offset|float) %}
  {% set speed = params.SPEED|default(18000)|float %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% if (pos.x - bx)|abs > 0.01 or (pos.y - by)|abs > 0.01 %}
    G90
    {% if (pos.x - bx)|abs > 0.01 %}
      {% if pos.y > 220 %}
        G1 Y220 F{speed}
      {% endif %}
      G1 X{bx} F{speed}
    {% endif %}
    G1 Y220 F{speed}
    G1 Y{by} F3000
  {% endif %}
  M400

# Knock the purge off on the box edge, no extrusion (zMod "_SBROS_TRASH"):
# out to Y 220, back in, out again.
[gcode_macro _SBROS_TRASH]
description: Wipe the purge off on the purge box edge
gcode:
  {% set t = printer.save_variables.variables.trash_offset|default({}) %}
  {% set unit = printer['gcode_macro _AD5X_UNIT'] %}
  {% set bx = 52.5 + (t.x if t.x is defined else unit.x_offset|float) %}
  {% set by = 229 + (t.y if t.y is defined else unit.y_offset|float) %}
  {% if (printer.gcode_move.gcode_position.x - bx)|abs > 0.01 %}
    _GOTO_TRASH
  {% endif %}
  G90
  G1 Y220 F12000
  G1 Y{by} F3000
  G1 Y220 F12000
  M400

# Toolhead runout sensor off / back on around slicer purges. As zMod:
# _ENABLE_SENSOR only switches it back on if _DISABLE_SENSOR found it on.
[gcode_macro _DISABLE_SENSOR]
description: Toolhead filament sensor off (remembers if it was on)
gcode:
  {% set name = printer['gcode_macro _ENABLE_SENSOR'].sensor %}
  {% set obj = printer['filament_switch_sensor ' ~ name]|default(none) %}
  {% if obj and obj.enabled %}
    SET_GCODE_VARIABLE MACRO=_ENABLE_SENSOR VARIABLE=was_enabled VALUE=1
    SET_FILAMENT_SENSOR SENSOR={name} ENABLE=0
  {% endif %}

[gcode_macro _ENABLE_SENSOR]
description: Toolhead filament sensor back on if _DISABLE_SENSOR switched it off
variable_sensor: 'toolhead'
variable_was_enabled: 0
gcode:
  {% if was_enabled and ('filament_switch_sensor ' ~ sensor) in printer %}
    SET_FILAMENT_SENSOR SENSOR={sensor} ENABLE=1
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ENABLE_SENSOR VARIABLE=was_enabled VALUE=0

# zMod takes timelapse frames with moonraker-timelapse. Without it this
# does nothing; installing moonraker-timelapse and including its
# timelapse.cfg in local.cfg (read later) replaces this macro.
[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Timelapse frame (nothing without moonraker-timelapse)
gcode:

# Spoolman (Moonraker): the slicer marks the spool in use. Moonraker only
# offers the call with a [spoolman] section; without one Klipper would stop
# the print ("Remote method not registered"), so it is off until spoolman: 1.
[gcode_macro SET_ACTIVE_SPOOL]
description: Spoolman: set the active spool (ID=)
variable_spoolman: 0
gcode:
  {% if 'ID' not in params %}
    RESPOND TYPE=error MSG="SET_ACTIVE_SPOOL: ID= is required"
  {% elif spoolman %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=params.ID|int)}
  {% else %}
    RESPOND MSG="SET_ACTIVE_SPOOL ID={params.ID}: Spoolman not set up, ignored"
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Spoolman: clear the active spool
gcode:
  {% if printer['gcode_macro SET_ACTIVE_SPOOL'].spoolman %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
  {% endif %}

# Pause at a layer (zMod and Mainsail/Fluidd names; the UIs set these
# through the variables below). The slicer reports layers with
# SET_PRINT_STATS_INFO CURRENT_LAYER=n, which checks them.
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: _SET_PRINT_STATS_INFO_BASE
description: Print layer info; pauses where SET_PAUSE_NEXT_LAYER / SET_PAUSE_AT_LAYER asked
variable_pause_next_layer: { 'enable': False, 'call': 'PAUSE' }
variable_pause_at_layer: { 'enable': False, 'layer': 0, 'call': 'PAUSE' }
gcode:
  _SET_PRINT_STATS_INFO_BASE {rawparams}
  {% if 'CURRENT_LAYER' in params %}
    {% set layer = params.CURRENT_LAYER|int %}
    {% if pause_next_layer.enable %}
      SET_PAUSE_NEXT_LAYER ENABLE=0
      RESPOND MSG="Pause at layer {layer} ({pause_next_layer.call})"
      {pause_next_layer.call}
    {% elif pause_at_layer.enable and layer == pause_at_layer.layer %}
      SET_PAUSE_AT_LAYER ENABLE=0
      RESPOND MSG="Pause at layer {layer} ({pause_at_layer.call})"
      {pause_at_layer.call}
    {% endif %}
  {% endif %}

[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause when the next layer starts: [ENABLE=1|0] [MACRO=PAUSE]
gcode:
  {% set cur = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set enable = params.ENABLE|default(1)|int != 0 %}
  {% set call = params.MACRO|default(cur.call) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{ {'enable': enable, 'call': call} }"

[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause when layer LAYER= starts: [ENABLE=1|0] [MACRO=PAUSE]
gcode:
  {% set cur = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set enable = params.ENABLE|int != 0 if 'ENABLE' in params else 'LAYER' in params %}
  {% set layer = params.LAYER|default(cur.layer)|int %}
  {% set call = params.MACRO|default(cur.call) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{ {'enable': enable, 'layer': layer, 'call': call} }"

# Filament change (zMod, Marlin): pause and wait at the purge box;
# RESUME goes back to the print.
[gcode_macro M600]
description: Filament change: pause at the purge box
gcode:
  PAUSE
  _GOTO_TRASH

# Chamber light (zMod: LED_ON, LED_OFF, LED S=0-100).
[gcode_macro LED_ON]
description: Chamber light on
gcode:
  SET_LED LED=chamber_led WHITE=1

[gcode_macro LED_OFF]
description: Chamber light off
gcode:
  SET_LED LED=chamber_led WHITE=0

[gcode_macro LED]
description: Chamber light brightness: S=0-100
gcode:
  SET_LED LED=chamber_led WHITE={[[params.S|default(100)|float, 0]|max, 100]|min / 100}

# M300 and PLAY_MIDI (zMod's speaker commands) are the system's now
# (klipper/extras/ad5x_sound.py).
