# zmod-compat plugin (plugin.json, README.md).
#
# G-code sliced for zMod (ghzserg/zmod) calls macros zMod defines. This
# plugin gives them the same names and parameters, mapped onto this
# system's own macros (PRINT_START, PRINT_END, the purge box in ifs.cfg)
# and, for zMod's nozzle control, the nozzle-guard plugin's NOZZLE_GUARD.
# Written for this project from zMod's documented behaviour; no zMod code
# copied. Table of commands: docs/zmod-compat.md.
#
# Settings (override in local.cfg, e.g. [gcode_macro START_PRINT]
# variable_line_purge: 0):
#   START_PRINT  line_purge: 1 = zMod's LINE_PURGE after the start (zMod
#                default "clear: LINE_PURGE"), 0 = none
#   END_PRINT    unload_filament: 1 = cut and unload the IFS lane at the
#                end (zMod "remove_filament"), 0 = leave it loaded
#   SET_ACTIVE_SPOOL spoolman: 1 once Moonraker has a [spoolman] section

# zMod's start command (its slicer profiles: START_PRINT EXTRUDER_TEMP=
# BED_TEMP=), run as PRINT_START. Without FORCE_* PRINT_START decides
# (macros/print_start.cfg: a mesh of the print area every print, like
# zMod's print_leveling: 1 with use_kamp: 1; the factory PRINT_START: the
# stock Z check). FORCE_LEVELING=1: new full bed mesh; FORCE_KAMP=1: new
# mesh of the print area only (KAMP). TOOL= (Bambufy's start G-code): load
# that slicer tool at the end of the start. With the IFS, the file's tools
# map to the loaded slots (zMod's default) for this print: ifs.py puts the
# map mode back when the print ends in any state. SKIP_LEVELING, MESH,
# INTERNAL, EXTERNAL are accepted and not needed (no chamber fans). Z_OFFSET is
# ignored: the saved Z offset is used, as zMod does with its default
# load_zoffset: 1.
[gcode_macro START_PRINT]
description: zMod print start (EXTRUDER_TEMP= BED_TEMP= [FORCE_LEVELING=] [FORCE_KAMP=] [TOOL=] [SOAK=]), runs PRINT_START
variable_line_purge: 1
gcode:
  # No EXTRUDER_TEMP=/BED_TEMP=: the temperature the file already set (Orca
  # profiles send their own M104/M140 before the start line and may leave
  # them out here), else zMod's defaults 245 / 80. Before, 245 replaced
  # the file's 235 for the whole print when no later M104 came.
  {% set raw_extruder = params.EXTRUDER_TEMP|default(printer.extruder.target if printer.extruder.target > 0 else 245)|string %}
  {% set raw_bed = params.BED_TEMP|default(printer.heater_bed.target if printer.heater_bed.target > 0 else 80)|string %}
  # Both must be numbers in range, checked before anything runs (an error
  # here stops the whole macro: no heating, no map mode). zMod turns an
  # unexpanded "[nozzle_temperature_initial_layer]" into 0 with |float and
  # then skips heating that heater; here it would print cold. Nozzle: from
  # min_extrude_temp (at least 150) to max_temp. Bed: 0 (off, a choice some
  # PLA profiles make) up to max_temp; a placeholder never reaches 0 here.
  {% set cfg = printer.configfile.settings %}
  {% set ext_cfg = cfg.extruder|default({}) %}
  {% set nozzle_min = [ext_cfg.min_extrude_temp|default(170)|float, 150.0]|max %}
  {% set nozzle_max = ext_cfg.max_temp|default(350)|float %}
  {% set bed_max = (cfg.heater_bed|default({})).max_temp|default(130)|float %}
  {% if not raw_extruder.replace('.', '', 1).isdigit() %}
    { action_raise_error("START_PRINT: EXTRUDER_TEMP=" ~ raw_extruder ~ " is not a temperature, print not started. The slicer left its placeholder as text: fix the start G-code in the printer profile.") }
  {% endif %}
  {% if not raw_bed.replace('.', '', 1).isdigit() %}
    { action_raise_error("START_PRINT: BED_TEMP=" ~ raw_bed ~ " is not a temperature, print not started. The slicer left its placeholder as text: fix the start G-code in the printer profile.") }
  {% endif %}
  {% set extruder = raw_extruder|float %}
  {% set bed = raw_bed|float %}
  {% if extruder < nozzle_min or extruder > nozzle_max %}
    { action_raise_error("START_PRINT: EXTRUDER_TEMP=" ~ raw_extruder ~ " is outside " ~ nozzle_min|int ~ "-" ~ nozzle_max|int ~ " C, print not started.") }
  {% endif %}
  {% if bed > bed_max %}
    { action_raise_error("START_PRINT: BED_TEMP=" ~ raw_bed ~ " is above " ~ bed_max|int ~ " C, print not started.") }
  {% endif %}
  {% if params.EXTRUDER_TEMP is not defined %}
    RESPOND MSG="START_PRINT: no EXTRUDER_TEMP=, nozzle {extruder|int} C ({'set by the file' if printer.extruder.target > 0 else 'zMod default'})"
  {% endif %}
  {% set kamp = params.FORCE_KAMP|default(0)|string|lower in ('1', 'true') %}
  {% set full = params.FORCE_LEVELING|default(0)|string|lower in ('1', 'true') %}
  # TOOL must be a number (or -1), as in PRINT_START. Text such as an
  # unexpanded "[initial_tool]" would turn into 0 and load tool 0 (issue #12).
  {% set raw_tool = params.TOOL|default('-1')|string %}
  {% set tool_ok = raw_tool == '-1' or raw_tool.isdigit() %}
  {% set tool = raw_tool|int if tool_ok else -1 %}
  {% if not tool_ok %}
    RESPOND TYPE=error MSG="PRINT_START: TOOL={raw_tool} is not a tool number, no tool loaded. Use the value from the slicer (issue 12)."
  {% endif %}
  {% if params.Z_OFFSET is defined and params.Z_OFFSET|float != 99.0 %}
    RESPOND MSG="START_PRINT: Z_OFFSET={params.Z_OFFSET} ignored, the saved Z offset is used"
  {% endif %}
  {% if 'gcode_macro _NOPOOP' in printer %}
    SET_GCODE_VARIABLE MACRO=_NOPOOP VARIABLE=next VALUE=0
  {% endif %}
  {% set level = '' %}
  {% if kamp %}
    {% set level = 'LEVEL=1 ADAPTIVE=1' %}
  {% elif full %}
    {% set level = 'LEVEL=1 ADAPTIVE=0' %}
  {% endif %}
  {% set soak = 'SOAK=' ~ params.SOAK if 'SOAK' in params else '' %}
  # zMod maps the file's tools to the loaded slots (its default): IFS loaded
  # mode for this print. ZMOD=1 makes ifs.py put the mode from before back
  # when the print ends (any end state, and after a restart).
  {% if 'ifs' in printer %}
    IFS_MAP_MODE MODE=loaded ZMOD=1
  {% endif %}
  PRINT_START BED={bed} EXTRUDER={extruder} TOOL={tool} {level} {soak}
  {% set pl = printer['gcode_macro _PRIME_LINE'] if 'gcode_macro _PRIME_LINE' in printer else none %}
  {% if line_purge and pl is not none and not pl.prime_line %}
    LINE_PURGE
  {% endif %}
  G90
  M83

# zMod's end command.
[gcode_macro END_PRINT]
description: zMod print end: PRINT_END (optionally unload the IFS lane first)
variable_unload_filament: 0
gcode:
  {% if unload_filament and 'ifs' in printer and printer.ifs.channel
        and 'xyz' in printer.toolhead.homed_axes %}
    IFS_UNLOAD
  {% endif %}
  PRINT_END

# zMod's settings command (SAVE_ZMOD_DATA KEY=value, kept in variables.cfg).
# USE_TRASH_ON_PRINT=0|1|2 is zMod's purge mode: saved as the save variable
# use_trash_on_print, which the nopoop plugin reads (anything else is
# refused, not turned into 0). Settings that are macro variables here are
# not changed: a line names the local.cfg setting. ZCONTROL_Z (zMod's
# height for its nozzle control) has no use here: a line says so. Other
# keys: one line, ignored.
[gcode_macro SAVE_ZMOD_DATA]
description: zMod settings: USE_TRASH_ON_PRINT=0|1|2 (purge mode); other keys are shown, not saved
gcode:
  {% set here = {
       'REMOVE_FILAMENT': '[gcode_macro END_PRINT] variable_unload_filament',
       'DISABLE_PRIMING': '[gcode_macro _PRIME_LINE] variable_prime_line (0 = no line)',
       'PRINT_LEVELING': '[gcode_macro PRINT_START] variable_mesh_every_print',
       'USE_KAMP': '[gcode_macro PRINT_START] variable_adaptive_mesh'} %}
  {% set ignored = [] %}
  {% if not params %}
    RESPOND MSG="SAVE_ZMOD_DATA: give KEY=value, e.g. USE_TRASH_ON_PRINT=0 (prime tower), 1 (purge at the box) or 2 (the slicer purges at the box)"
  {% endif %}
  {% for key in params %}
    {% set value = params[key]|string %}
    {% if key == 'USE_TRASH_ON_PRINT' %}
      {% if value in ['0', '1', '2'] %}
        SAVE_VARIABLE VARIABLE=use_trash_on_print VALUE={value}
        RESPOND MSG="SAVE_ZMOD_DATA: use_trash_on_print = {value}"
      {% else %}
        RESPOND TYPE=error MSG="SAVE_ZMOD_DATA: USE_TRASH_ON_PRINT={value} is not 0, 1 or 2, not saved"
      {% endif %}
    {% elif key in here %}
      RESPOND MSG="SAVE_ZMOD_DATA: {key} not saved, here it is {here[key]} in local.cfg"
    {% elif key == 'ZCONTROL_Z' %}
      RESPOND MSG="SAVE_ZMOD_DATA: ZCONTROL_Z not saved, a nozzle hit pauses the print at any height here (nozzle-guard plugin)"
    {% else %}
      {% set _ = ignored.append(key) %}
    {% endif %}
  {% endfor %}
  {% if ignored %}
    RESPOND MSG="SAVE_ZMOD_DATA: {ignored|join(', ')} ignored (zMod settings with no counterpart here)"
  {% endif %}

# zMod's priming line (its "clear" setting LINE_PURGE, from KAMP): the
# printer's _PRIME_LINE (macros/prime_line.cfg), in front of the objects
# the slicer labelled.
[gcode_macro LINE_PURGE]
description: Prime line in front of the print area
gcode:
  {% if 'gcode_macro _PRIME_LINE' in printer %}
    _PRIME_LINE FORCE=1
  {% else %}
    RESPOND MSG="LINE_PURGE: no prime line (macros/prime_line.cfg is missing)"
  {% endif %}

# Into the purge box (slicer tool-change G-code in "slicer-controlled
# purge" mode). As zMod: X first (leaving the box towards Y 220 if inside
# it), then into the box along Y. Box: X 52.5 / Y 229 plus this printer's
# offset (TRASH_OFFSET, else unit.cfg), as _PURGE_BOX_POS holds it
# (ad5x.cfg): the same spot the purge uses.
[gcode_macro _GOTO_TRASH]
description: Move into the purge box
gcode:
  {% set box = printer['gcode_macro _PURGE_BOX_POS'] %}
  {% set bx = box.x %}
  {% set by = box.y %}
  {% set speed = params.SPEED|default(18000)|float %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% if (pos.x - bx)|abs > 0.01 or (pos.y - by)|abs > 0.01 %}
    G90
    {% if (pos.x - bx)|abs > 0.01 %}
      {% if pos.y > 220 %}
        G1 Y220 F{speed}
      {% endif %}
      G1 X{bx} F{speed}
    {% endif %}
    G1 Y220 F{speed}
    G1 Y{by} F3000
  {% endif %}
  M400

# Knock the purge off on the box edge, no extrusion (zMod "_SBROS_TRASH"):
# out to Y 220, back in, out again.
[gcode_macro _SBROS_TRASH]
description: Wipe the purge off on the purge box edge
gcode:
  {% set box = printer['gcode_macro _PURGE_BOX_POS'] %}
  {% set bx = box.x %}
  {% set by = box.y %}
  {% if (printer.gcode_move.gcode_position.x - bx)|abs > 0.01 %}
    _GOTO_TRASH
  {% endif %}
  G90
  G1 Y220 F12000
  G1 Y{by} F3000
  G1 Y220 F12000
  M400

# Toolhead runout sensor off / back on around slicer purges. As zMod:
# _ENABLE_SENSOR only switches it back on if _DISABLE_SENSOR found it on.
[gcode_macro _DISABLE_SENSOR]
description: Toolhead filament sensor off (remembers if it was on)
gcode:
  {% set name = printer['gcode_macro _ENABLE_SENSOR'].sensor %}
  {% set obj = printer['filament_switch_sensor ' ~ name]|default(none) %}
  {% if obj and obj.enabled %}
    SET_GCODE_VARIABLE MACRO=_ENABLE_SENSOR VARIABLE=was_enabled VALUE=1
    SET_FILAMENT_SENSOR SENSOR={name} ENABLE=0
  {% endif %}

[gcode_macro _ENABLE_SENSOR]
description: Toolhead filament sensor back on if _DISABLE_SENSOR switched it off
variable_sensor: 'toolhead'
variable_was_enabled: 0
gcode:
  {% if was_enabled and ('filament_switch_sensor ' ~ sensor) in printer %}
    SET_FILAMENT_SENSOR SENSOR={sensor} ENABLE=1
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ENABLE_SENSOR VARIABLE=was_enabled VALUE=0

# zMod takes timelapse frames with moonraker-timelapse. Without it this
# does nothing; installing moonraker-timelapse and including its
# timelapse.cfg in local.cfg (read later) replaces this macro.
[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Timelapse frame (nothing without moonraker-timelapse)
gcode:

# Spoolman (Moonraker): the slicer marks the spool in use. Moonraker only
# offers the call with a [spoolman] section; without one Klipper would stop
# the print ("Remote method not registered"), so it is off until spoolman: 1.
[gcode_macro SET_ACTIVE_SPOOL]
description: Spoolman: set the active spool (ID=)
variable_spoolman: 0
gcode:
  {% if 'ID' not in params %}
    RESPOND TYPE=error MSG="SET_ACTIVE_SPOOL: ID= is required"
  {% elif spoolman %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=params.ID|int)}
  {% else %}
    RESPOND MSG="SET_ACTIVE_SPOOL ID={params.ID}: Spoolman not set up, ignored"
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Spoolman: clear the active spool
gcode:
  {% if printer['gcode_macro SET_ACTIVE_SPOOL'].spoolman %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
  {% endif %}

# Pause at a layer (zMod and Mainsail/Fluidd names; the UIs set these
# through the variables below). The slicer reports layers with
# SET_PRINT_STATS_INFO CURRENT_LAYER=n, which checks them.
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: _SET_PRINT_STATS_INFO_BASE
description: Print layer info; pauses where SET_PAUSE_NEXT_LAYER / SET_PAUSE_AT_LAYER asked
variable_pause_next_layer: { 'enable': False, 'call': 'PAUSE' }
variable_pause_at_layer: { 'enable': False, 'layer': 0, 'call': 'PAUSE' }
gcode:
  _SET_PRINT_STATS_INFO_BASE {rawparams}
  {% if 'CURRENT_LAYER' in params %}
    {% set layer = params.CURRENT_LAYER|int %}
    {% if pause_next_layer.enable %}
      SET_PAUSE_NEXT_LAYER ENABLE=0
      RESPOND MSG="Pause at layer {layer} ({pause_next_layer.call})"
      {pause_next_layer.call}
    {% elif pause_at_layer.enable and layer == pause_at_layer.layer %}
      SET_PAUSE_AT_LAYER ENABLE=0
      RESPOND MSG="Pause at layer {layer} ({pause_at_layer.call})"
      {pause_at_layer.call}
    {% endif %}
  {% endif %}

[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause when the next layer starts: [ENABLE=1|0] [MACRO=PAUSE]
gcode:
  {% set cur = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set enable = params.ENABLE|default(1)|int != 0 %}
  {% set call = params.MACRO|default(cur.call) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{ {'enable': enable, 'call': call} }"

[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause when layer LAYER= starts: [ENABLE=1|0] [MACRO=PAUSE]
gcode:
  {% set cur = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set enable = params.ENABLE|int != 0 if 'ENABLE' in params else 'LAYER' in params %}
  {% set layer = params.LAYER|default(cur.layer)|int %}
  {% set call = params.MACRO|default(cur.call) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{ {'enable': enable, 'layer': layer, 'call': call} }"

# Filament change (zMod, Marlin): pause, lift and wait at the purge box;
# RESUME goes back to the print. The lift is zMod's park lift (50 mm, at
# most to 5 mm under the top of Z; local.cfg can set variable_lift), so
# filament purged by hand at the box hangs well clear of the print. The
# way back (RESUME below) is the IFS swap's: Z still up, the bed lowered, Y first (out
# of the box), then X, then Z down over the print position. zMod's T= and
# TRASH= select a tool head on other printers; on the AD5X they do
# nothing, as in zMod. Not homed: pause only.
[gcode_macro M600]
description: Filament change: pause, lift and wait at the purge box
variable_lift: 50.0
# Where the print stopped and the travel height (G-code X/Y/Z, lz) while
# an M600 pause lasts, for RESUME; None otherwise
variable_resume_pos: None
gcode:
  {% set cur = printer.gcode_move.gcode_position %}
  {% set th = printer.toolhead %}
  {% set top = th.axis_maximum.z - printer.gcode_move.homing_origin.z - 5 %}
  {% if resume_pos and printer.pause_resume.is_paused %}
    # M600 again during its own pause: keep the first one's way back
    {% set back = resume_pos %}
  {% else %}
    {% set back = {'x': cur.x, 'y': cur.y, 'z': cur.z, 'lz': [[cur.z + lift, top]|min, cur.z]|max} %}
  {% endif %}
  PAUSE
  {% if 'xyz' in th.homed_axes %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=resume_pos VALUE="{back}"
    G90
    {% if cur.z < back.lz %}
      G1 Z{back.lz} F1500
    {% endif %}
    _GOTO_TRASH
  {% else %}
    RESPOND MSG="M600: not homed, paused where it is"
  {% endif %}

# PAUSE and RESUME stay ad5x.cfg's pass-throughs over Klipper's
# (BASE_PAUSE, BASE_RESUME, {rawparams} passed on). Only a RESUME after
# M600 adds the way back from the box: Y, X at the travel height, then
# BASE_RESUME makes the Z move and restores modes, speed and E as before.
# Any other pause (screen, Fluidd, runout, IFS auto-refill, pause at a
# layer with MACRO=PAUSE) forgets an old M600 position (a print cancelled
# at an M600 pause), so its RESUME is Klipper's as without this plugin.
[gcode_macro PAUSE]
description: Pause the print (pause_resume)
gcode:
  {% if not printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=resume_pos VALUE=None
  {% endif %}
  BASE_PAUSE {rawparams}

[gcode_macro RESUME]
description: Resume a paused print (pause_resume), after M600 from the purge box: Y, X, then Z
gcode:
  {% set back = printer['gcode_macro M600'].resume_pos %}
  {% if back and printer.pause_resume.is_paused %}
    {% if 'xyz' in printer.toolhead.homed_axes %}
      {% set cur = printer.gcode_move.gcode_position %}
      G90
      {% if cur.z < back.lz %}
        # Moved lower during the pause: back up before travelling
        G1 Z{back.lz} F1500
      {% endif %}
      G1 Y{back.y} F12000
      G1 X{back.x} F12000
    {% endif %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=resume_pos VALUE=None
  {% endif %}
  BASE_RESUME {rawparams}

# zMod's nozzle collision control (NOZZLE_CONTROL, ZCONTROL_*), mapped onto
# the nozzle-guard plugin (NOZZLE_GUARD, docs/nozzle-guard.md). A hit here
# always pauses the print and the bed stays hot: zMod's abort mode (a
# Klipper shutdown, which turns the bed off) is not copied, so
# ZCONTROL_ABORT and ZCONTROL_AUTO pause too and ZCONTROL_Z (zMod's height
# between abort and pause) does nothing. PRINT_START arms the guard itself
# at the end of the start, as zMod's START_PRINT does with ZCONTROL_ON.
# With the nozzle-guard plugin off each command shows one line and does
# nothing, so a zMod file keeps printing.
[gcode_macro _ZMOD_NOZZLE_GUARD]
description: NOZZLE_GUARD with the given options (NAME= the zMod command), one line if the nozzle-guard plugin is off
gcode:
  {% set name = params.NAME|default('NOZZLE_CONTROL') %}
  {% if 'ad5x_nozzle_guard' in printer %}
    {% set args = [] %}
    {% for key in params %}
      {% if key != 'NAME' %}
        {% set _ = args.append(key ~ '=' ~ params[key]) %}
      {% endif %}
    {% endfor %}
    NOZZLE_GUARD {args|join(' ')}
  {% else %}
    RESPOND MSG="{name}: the nozzle-guard plugin is off, ignored (Settings > Safety & Alerts, or ENABLE_PLUGIN NAME=nozzle-guard)"
  {% endif %}

# zMod's NOZZLE_CONTROL WEIGHT=<g> (zMod's default 1500): the guard's limit,
# saved in variables.cfg, and the guard on; WEIGHT=0 turns it off. zMod's
# usual values (800-1500 g) are far less sensitive than the guard's 300 g;
# the value is used as given. No restart (zMod restarts Klipper or the
# printer). A WEIGHT that is not a number or is under 20 g changes nothing
# and shows a line, not an error, so the file goes on.
[gcode_macro NOZZLE_CONTROL]
description: zMod nozzle control: WEIGHT=<g> sets the nozzle-guard limit and turns it on, WEIGHT=0 turns it off, no WEIGHT reports
gcode:
  {% set raw = params.WEIGHT|default('')|string %}
  {% if params.WEIGHT is not defined %}
    # No WEIGHT: only report (zMod would set its default 1500 g)
    _ZMOD_NOZZLE_GUARD NAME=NOZZLE_CONTROL
  {% elif not raw.replace('.', '', 1).isdigit() %}
    RESPOND TYPE=error MSG="NOZZLE_CONTROL: WEIGHT={raw} is not a weight in grams, nothing changed"
  {% elif raw|float == 0 %}
    _ZMOD_NOZZLE_GUARD NAME=NOZZLE_CONTROL ENABLE=0
  {% elif raw|float < 20 %}
    RESPOND TYPE=error MSG="NOZZLE_CONTROL: WEIGHT={raw} is under 20 g, nothing changed"
  {% else %}
    _ZMOD_NOZZLE_GUARD NAME=NOZZLE_CONTROL ENABLE=1 THRESHOLD={raw|float}
  {% endif %}

# zMod's ZCONTROL_* switches. ON, PAUSE, AUTO and ABORT arm the guard
# (during a print only; outside one they report); OFF disarms it until an
# ON or the next print; STATUS reports the state and the largest push of
# the print.
[gcode_macro ZCONTROL_ON]
description: zMod: nozzle guard on for this print (NOZZLE_GUARD ARM=1)
gcode:
  _ZMOD_NOZZLE_GUARD NAME=ZCONTROL_ON ARM=1

[gcode_macro ZCONTROL_OFF]
description: zMod: nozzle guard off for this print (NOZZLE_GUARD ARM=0)
gcode:
  _ZMOD_NOZZLE_GUARD NAME=ZCONTROL_OFF ARM=0

[gcode_macro ZCONTROL_PAUSE]
description: zMod: nozzle guard on, a hit pauses (NOZZLE_GUARD ARM=1)
gcode:
  _ZMOD_NOZZLE_GUARD NAME=ZCONTROL_PAUSE ARM=1

[gcode_macro ZCONTROL_AUTO]
description: zMod: nozzle guard on, a hit pauses at any height (NOZZLE_GUARD ARM=1)
gcode:
  _ZMOD_NOZZLE_GUARD NAME=ZCONTROL_AUTO ARM=1

[gcode_macro ZCONTROL_ABORT]
description: zMod: nozzle guard on, a hit pauses here and Klipper is not stopped (NOZZLE_GUARD ARM=1)
gcode:
  _ZMOD_NOZZLE_GUARD NAME=ZCONTROL_ABORT ARM=1
  {% if 'ad5x_nozzle_guard' in printer %}
    RESPOND MSG="ZCONTROL_ABORT: a nozzle hit pauses the print here (bed stays hot), Klipper is not stopped"
  {% endif %}

[gcode_macro ZCONTROL_STATUS]
description: zMod: nozzle guard state (NOZZLE_GUARD)
gcode:
  _ZMOD_NOZZLE_GUARD NAME=ZCONTROL_STATUS

[gcode_macro ZCONTROL_Z]
description: zMod: height between abort and pause (Z=), accepted, no effect here
gcode:
  RESPOND MSG="ZCONTROL_Z: ignored, a nozzle hit pauses the print at any height here"

# Chamber light (zMod: LED_ON, LED_OFF, LED S=0-100).
[gcode_macro LED_ON]
description: Chamber light on
gcode:
  SET_LED LED=chamber_led WHITE=1

[gcode_macro LED_OFF]
description: Chamber light off
gcode:
  SET_LED LED=chamber_led WHITE=0

[gcode_macro LED]
description: Chamber light brightness: S=0-100
gcode:
  SET_LED LED=chamber_led WHITE={[[params.S|default(100)|float, 0]|max, 100]|min / 100}

# M300 and PLAY_MIDI (zMod's speaker commands) are the system's now
# (klipper/extras/ad5x_sound.py).
