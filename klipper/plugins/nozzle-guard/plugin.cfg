# nozzle-guard plugin (plugin.json, docs/nozzle-guard.md).
#
# Pauses the print when the nozzle hits the print or the bed: the bed
# weighing board is read 5 times a second during a print, and a push above
# the limit for 3 readings in a row pauses it, with the reason on the
# screen. Armed at the end of PRINT_START; not watching while homing or
# probing, during an IFS colour change or while paused. Idea from zMod's
# NOZZLE_CONTROL (zmod-compat maps its commands here).
#
# On/off and the limit without restarting Klipper (saved in variables.cfg):
#   NOZZLE_GUARD ENABLE=0|1
#   NOZZLE_GUARD SENSITIVITY=low|medium|high   (600 / 300 / 150 g)
#   NOZZLE_GUARD THRESHOLD=<g>
# NOZZLE_GUARD alone reports the state and the largest push seen in this
# print, to pick a limit.

[ad5x_nozzle_guard]
# Starting values; NOZZLE_GUARD's saved values win.
#threshold: 300
#samples: 3
#rate: 5
#settle_time: 2
