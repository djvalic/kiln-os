# Happy Hare MMU Plugin for Kiln OS (Flashforge IFS)
#
# Replaces stock [ifs] driver with Happy Hare v4 MMU engine:
# - Fast toolhead parking (~142mm swap above 4-to-1 combiner)
# - Synchronized gear motor drive with extruder (sync_to_extruder: 1)
# - FlowGuard active clog & tangle protection via analog spring buffers
# - AD5X trash box purge, cooling dwell, and silicone brush wipe
# - Slicer and UI compatibility macros (T0-T3, IFS_LOAD, IFS_UNLOAD, IFS_SWAP, IFS_SELECT)

[ifs]
enable: False

[include mmu-flashforge-ifs.cfg]
