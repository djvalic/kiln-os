# Flashforge AD5X IFS (Intelligent Filament System) hardware configuration
# for Happy Hare (v4).
#
# Hardware mapping:
#   MCU: Nations Technologies N32G455 (144 MHz) on /dev/ttyS4, half-duplex RS485 @ 115200
#   Selector: Linear stepper on ifs:PA7/PA6 with optical endstop ^!ifs:PB9
#   Gear/Feeder: Feeder stepper on ifs:PA0/PA1
#   Inlet Sensors: Optical ADC pins ifs:PC0, ifs:PC2, ifs:PB12, ifs:PB14
#   Buffer Sensors: Active sync-feedback analog ADC pins ifs:PC1, ifs:PC3, ifs:PB13, ifs:PB15
#   Toolhead Sensor: toolhead on eboard:PA3 via adc_filament_sensor

[mcu ifs]
serial: /dev/ttyS4
baud: 115200
restart_method: command

# Status LEDs / Power
[output_pin ifs_pb5]
pin: ifs:PB5
value: 1

[output_pin ifs_pb6]
pin: ifs:PB6
value: 0

# --- Raw ADC Channels for Gate Inlets ---
[adc_temperature ifs_raw_adc]
temperature1: 0
voltage1: 0
temperature2: 4095
voltage2: 3.3

[temperature_sensor ifs_spool1_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC0
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool2_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC2
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool3_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB12
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool4_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB14
min_temp: -100
max_temp: 10000

# --- Gate Entry Window Sensors (Linked to Happy Hare) ---
[adc_filament_sensor mmu_gate_0]
adc: temperature_sensor ifs_spool1_inlet
present_below: 0.22
present_above: 0.76

[adc_filament_sensor mmu_gate_1]
adc: temperature_sensor ifs_spool2_inlet
present_below: 0.22
present_above: 0.76

[adc_filament_sensor mmu_gate_2]
adc: temperature_sensor ifs_spool3_inlet
present_below: 0.22
present_above: 0.76

[adc_filament_sensor mmu_gate_3]
adc: temperature_sensor ifs_spool4_inlet
present_below: 0.22
present_above: 0.76

# --- Happy Hare Core Machine ---
[mmu_machine]
happy_hare_version: 4.1.0
units: ifs

[mmu_parameters]
log_level: 1
log_file_level: 2

# --- Happy Hare Unit Definition ---
[mmu_unit ifs]
num_gates: 4
vendor: Other
version: 1.0
selector_type: LinearSelector
filament_always_gripped: 1
gear_stepper: ifs_gear
selector_stepper: ifs_selector
buffer: ifs_buffer
toolhead: default

[mmu_unit_parameters ifs]
cad_gate0_pos: 0.0
cad_gate_width: 10.24
selector_move_speed: 10.0
selector_homing_speed: 5.0
selector_accel: 100.0
gear_load_speed: 25.0
gear_unload_speed: 25.0
gear_homing_speed: 15.0
gear_short_move_speed: 10.0
gate_homing_endstop: none
gate_parking_distance: 0.0
bowden_load_homing_buffer: 35.0
bowden_unload_homing_buffer: 0.0
toolhead_homing_max: 125.0
toolhead_unload_safety_margin: 70.0
park_at_toolhead: 1
sync_to_extruder: 1
sync_form_tip: 1
sync_purge: 1
sync_gear_current: 100

# --- Stepper Motors ---
[mmu_stepper ifs_gear]
step_pin: ifs:PA0
dir_pin: !ifs:PA1
enable_pin: !ifs:PA5
microsteps: 8
rotation_distance: 4.5
velocity: 35
accel: 200

[tmc2209 mmu_stepper ifs_gear]
uart_pin: ifs:PA3
tx_pin: ifs:PA2
interpolate: True
run_current: 0.6
hold_current: 0.3
sense_resistor: 0.110

[mmu_stepper ifs_selector]
step_pin: ifs:PA7
dir_pin: !ifs:PA6
enable_pin: !ifs:PB1
endstop_pin: ^!ifs:PB9
microsteps: 8
rotation_distance: 4.0
velocity: 15
accel: 100

[tmc2209 mmu_stepper ifs_selector]
uart_pin: ifs:PC5
tx_pin: ifs:PC4
interpolate: True
run_current: 0.6
hold_current: 0.3
sense_resistor: 0.110

# --- Happy Hare Gate Entry Sensors ---
[mmu_sensors ifs]
mmu_entry_switch_pin_0: sensor:mmu_gate_0
mmu_entry_switch_pin_1: sensor:mmu_gate_1
mmu_entry_switch_pin_2: sensor:mmu_gate_2
mmu_entry_switch_pin_3: sensor:mmu_gate_3

# --- Active Sync-Feedback Buffer with Dynamic Pin Routing ---
[mmu_buffer ifs_buffer]
analog_pins: ifs:PC1, ifs:PC3, ifs:PB13, ifs:PB15
analog_max_tension: 0.85
analog_max_compression: 0.15
analog_neutral_point: 0.50
analog_sensor_threshold: 0.90
buffer_range: 20.0
buffer_maxrange: 25.0

# --- Toolhead Wrapper ---
[mmu_toolhead default]
toolhead_switch_pin: sensor:toolhead
register_toolhead_sensors: 0
toolhead_extruder_to_nozzle: 72.0
toolhead_sensor_to_nozzle: 85.0
toolhead_entry_to_extruder: 0.0

# --- Tip Forming / Cutting Macro for Unloading ---
[gcode_macro _MMU_FORM_TIP]
description: Tip forming or mechanical cutting before unloading
variable_use_cutter: 1
gcode:
  {% if use_cutter|int == 1 %}
    {% if printer.toolhead.homed_axes != "xyz" %}
      RESPOND TYPE=echo MSG="Axes not fully homed, homing XYZ before mechanical cut"
      G28
    {% endif %}
    SAVE_GCODE_STATE NAME=MMU_CUT_TIP_state
    {% set unit = printer['gcode_macro _AD5X_UNIT'] %}
    G90
    G1 Y10 F18000
    G1 Y{unit.cut_y_offset - 7.5} F1800
    G1 X20 F12000
    G1 X{unit.cut_x_offset - 2.5} F600
    M400
    M83
    G1 E-5 F600
    M400
    G90
    G1 X{52.5 + unit.x_offset} F12000
    G1 Y220 F12000
    G1 Y{229 + unit.y_offset} F3000
    M400
    RESTORE_GCODE_STATE NAME=MMU_CUT_TIP_state
  {% else %}
    SAVE_GCODE_STATE NAME=MMU_FORM_TIP_state
    M83
    G92 E0
    # Fast initial pull to snap molten tip cleanly
    G1 E-15 F3000
    G4 P1000
    # Pull through cold zone past extruder drive gears
    G1 E-45 F600
    RESTORE_GCODE_STATE NAME=MMU_FORM_TIP_state
  {% endif %}

[gcode_macro MMU_SET_CUTTER]
description: Enable or disable mechanical cutter vs thermal tip forming (ENABLE=1 for cut, ENABLE=0 for thermal tip)
gcode:
  {% set enable = params.ENABLE|default(1)|int %}
  SET_GCODE_VARIABLE MACRO=_MMU_FORM_TIP VARIABLE=use_cutter VALUE={enable}
  RESPOND MSG="MMU unload method set to: {'MECHANICAL CUT' if enable == 1 else 'THERMAL TIP FORMING'}"

[gcode_macro _MMU_POST_FORM_TIP]
gcode:

[gcode_macro _MMU_PURGE]
description: Purge filament into AD5X trash box, cool, wipe and brush
gcode:
  {% set purge_len = params.PURGE_LENGTH|default(params.LENGTH|default(40))|float %}
  {% set orig_fan = printer["fan_generic fanM106"].speed if "fan_generic fanM106" in printer else 0.0 %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  SAVE_GCODE_STATE NAME=MMU_PURGE_state
  _PURGE_BOX
  M83
  G1 E{purge_len} F300
  M400
  M106 S125
  G4 P3000
  G1 E-3 F300
  M400
  _PURGE_WIPE
  _NOZZLE_BRUSH
  M106 S{(orig_fan * 255)|round|int}
  RESTORE_GCODE_STATE NAME=MMU_PURGE_state

[gcode_macro _MMU_PARK]
variable_retracted_length: 0.0
variable_next_xy: 0.0, 0.0
variable_next_pos: False
variable_min_lifted_z: 0.0
variable_toolchange_z: -1.0
variable_saved_pos: False
variable_saved_xyz: 0.0, 0.0, 0.0
variable_park_operation: ''
gcode:
  {% if printer.toolhead.homed_axes == "xyz" %}
    _PURGE_BOX
  {% endif %}

[gcode_macro _MMU_SAVE_POSITION]
gcode:
  SAVE_GCODE_STATE NAME=MMU_POSITION_STATE

[gcode_macro _MMU_RESTORE_POSITION]
gcode:
  {% set restore = params.RESTORE|default(1)|int %}
  {% if restore %}
    RESTORE_GCODE_STATE NAME=MMU_POSITION_STATE MOVE=1 MOVE_SPEED=200
  {% else %}
    RESTORE_GCODE_STATE NAME=MMU_POSITION_STATE
  {% endif %}

[gcode_macro _MMU_PRE_LOAD]
gcode:

[gcode_macro _MMU_PRE_UNLOAD]
gcode:
  SET_FILAMENT_SENSOR SENSOR=toolhead ENABLE=0

[gcode_macro _MMU_POST_LOAD]
gcode:
  SET_FILAMENT_SENSOR SENSOR=toolhead ENABLE=1

[gcode_macro _MMU_POST_UNLOAD]
gcode:

# --- Slicer & UI Tool Change Compatibility Macros ---
[gcode_macro T0]
gcode: MMU_CHANGE_TOOL TOOL=0

[gcode_macro T1]
gcode: MMU_CHANGE_TOOL TOOL=1

[gcode_macro T2]
gcode: MMU_CHANGE_TOOL TOOL=2

[gcode_macro T3]
gcode: MMU_CHANGE_TOOL TOOL=3

[gcode_macro IFS_LOAD]
gcode:
  {% set chan = params.CHANNEL|default(1)|int %}
  MMU_LOAD GATE={chan - 1}

[gcode_macro IFS_UNLOAD]
gcode:
  MMU_UNLOAD

[gcode_macro IFS_SWAP]
gcode:
  {% set chan = params.CHANNEL|default(1)|int %}
  MMU_CHANGE_TOOL TOOL={chan - 1}

[gcode_macro IFS_SELECT]
gcode:
  {% set chan = params.CHANNEL|default(1)|int %}
  MMU_SELECT GATE={chan - 1}

[gcode_macro _IFS_STATE]
variable_fan: 0
gcode:



