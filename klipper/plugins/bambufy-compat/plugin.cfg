# bambufy-compat plugin (plugin.json, README.md).
#
# G-code from Bambufy's slicer profiles (Bambufy, a zMod plugin for the
# AD5X) calls two macros of its own besides zMod's (zmod-compat):
#   _NOPOOP  just before T<n> when the prime tower takes the purge: that
#            tool change only fills the nozzle, no purge at the box
#   _M106 FAN_MAX_SPEED=  part fan during its flushes
# A T<n> without _NOPOOP keeps this system's behaviour (purge at the box,
# or what the nopoop plugin's use_trash_on_print says). Written for this
# project from Bambufy's documented slicer G-code; no Bambufy code used.

# Marks the next tool change as purged by the prime tower (one change).
[gcode_macro _NOPOOP]
description: Next tool change: prime only, the prime tower purges (Bambufy)
variable_next: 0
gcode:
  SET_GCODE_VARIABLE MACRO=_NOPOOP VARIABLE=next VALUE=1

# T0-T3 as in ifs.cfg (tool map), plus PURGE=0 after _NOPOOP in a print.
# They need Kiln's IFS module: listed after a plugin that drives the IFS
# (plugins.cfg order), they replace its T0-T3, so they stop with a message.
[gcode_macro _NOPOOP_T]
gcode:
  {% if 'ifs' not in printer %}
    { action_raise_error("T%s: Kiln's IFS module is off (a plugin drives the IFS) and bambufy-compat's T0-T3 replace that plugin's: DISABLE_PLUGIN NAME=bambufy-compat" % (params.TOOL|default('?'))) }
  {% endif %}
  {% set nopoop = printer['gcode_macro _NOPOOP'].next %}
  {% set purge = '' %}
  {% if nopoop and printer.print_stats.state == 'printing' %}
    {% set purge = 'PURGE=0' %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_NOPOOP VARIABLE=next VALUE=0
  IFS_SWAP CHANNEL={printer.ifs.tool_map[params.TOOL|string]} {purge}

[gcode_macro T0]
gcode: _NOPOOP_T TOOL=0
[gcode_macro T1]
gcode: _NOPOOP_T TOOL=1
[gcode_macro T2]
gcode: _NOPOOP_T TOOL=2
[gcode_macro T3]
gcode: _NOPOOP_T TOOL=3

# Part fan at FAN_MAX_SPEED percent times factor (Bambufy's default
# fan_max_speed_factor 0.5).
[gcode_macro _M106]
description: Part fan for purges: FAN_MAX_SPEED= (percent) x factor
variable_factor: 0.5
gcode:
  {% set pct = [[params.FAN_MAX_SPEED|default(100)|float, 0]|max, 100]|min %}
  M106 S{(255 * pct / 100 * factor)|round|int}
