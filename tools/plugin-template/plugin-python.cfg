# __NAME__: a Kiln OS plugin (README.md). Change the greeting in
# local.cfg:
#   [__MOD__]
#   greeting: Hi

# The Klipper module extras/__MOD__.py
[__MOD__]
greeting: Hello

[gcode_macro __MACRO___HELLO]
description: Say hello (__NAME__ plugin)
gcode:
  __MACRO___GREET NAME={params.NAME|default("world")}
