# Kiln OS (docs/network.md). NetworkManager runs when S40ad5x-network chose
# it for this start; it made the connections in /run/ad5x-network/connections
# from /data/ad5x/network.conf and /data/ad5x/wpa_supplicant.conf, and writes
# the Wi-Fi networks saved here back to wpa_supplicant.conf. State (leases)
# in /data/ad5x/NetworkManager: /var/lib/NetworkManager links there.
# /run/NetworkManager/conf.d/50-ad5x-wifi-disable.conf: wlan0 unmanaged
# (/data/ad5x/wifi.disable). Settings from PR #53 by jolting (Hunter Laux).
[main]
plugins=keyfile
dhcp=internal
# /etc/resolv.conf links to /run/resolv.conf: written through the link
rc-manager=file
# No polkit in the image: only root may change the network (HelixScreen
# runs as root); Klipper's and the web server's users may only read
auth-polkit=root-only
# No "Wired connection 1" of its own: Ethernet is S40's connection, with
# stock's MAC (as S41ad5x-eth sets it)
no-auto-default=*

[keyfile]
path=/run/ad5x-network/connections

[device]
# A stable MAC while scanning; the 8821CU on rtw88 is touchy enough
wifi.scan-rand-mac-address=no

[connection]
# Power saving off on every Wi-Fi connection: with it on, the rtw88
# 8821CU's signal falls to -95 dBm and it drops and rejoins (issue #37)
wifi.powersave=2
# DHCP identifies the printer by its MAC, as udhcpc did, so it keeps its
# address: the machine ID NetworkManager would otherwise derive an
# identity from is made new at every boot (/var/lib/dbus is a tmpfs link)
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
