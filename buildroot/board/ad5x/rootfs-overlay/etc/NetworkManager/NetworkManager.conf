# Kiln OS (docs/networkmanager.md). The root is read-only: connections in
# /data/ad5x/NetworkManager/system-connections (made by S44ad5x-network,
# which imports the older configuration once), state in
# /data/ad5x/NetworkManager/lib (/var/lib/NetworkManager links there).
[main]
plugins=keyfile
dhcp=internal
# /etc/resolv.conf links to /run/resolv.conf: write through the link
rc-manager=file

[keyfile]
path=/data/ad5x/NetworkManager/system-connections

[device]
# A stable MAC while scanning; the 8821CU on rtw88 is touchy enough
wifi.scan-rand-mac-address=no

[connection]
# Power saving off on every Wi-Fi connection: with it on, the rtw88
# 8821CU's signal falls to -95 dBm and it drops and rejoins (issue #37)
wifi.powersave=2
# DHCP identifies the printer by its MAC, as udhcpc did, so it keeps its
# address across reboots: the machine ID NetworkManager would otherwise
# derive an identity from is made new at every boot (/var/lib/dbus is a
# tmpfs link, the root read-only)
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
