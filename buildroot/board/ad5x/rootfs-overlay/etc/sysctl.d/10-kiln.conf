# Kiln OS kernel settings, read at boot by Buildroot's S02sysctl (main
# system only: the recovery image has its own overlay).
#
# Root works in folders the klipper user can change (plugin requests,
# update downloads). These make the kernel refuse the usual tricks there:
#   protected_hardlinks  no hard link to a file you neither own nor can
#                        read and write (klipper linking one of root's)
#   protected_symlinks   in a sticky folder others can write (/tmp), a link
#                        is only followed when its owner is the folder's
#                        owner or the one following it
#   protected_fifos,     in such a folder, opening with O_CREAT doesn't
#   protected_regular    open a FIFO or a file someone else put there
# The checks in the init scripts stay (S68ad5x-update-agent): these only
# cover sticky folders and links. A kernel that lacks a key (the stock 4.4
# has no protected_fifos or protected_regular) makes sysctl print an error
# and go on.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 1
