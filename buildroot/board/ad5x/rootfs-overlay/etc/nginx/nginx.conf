# nginx on Kiln OS: Fluidd on port 80, Moonraker (127.0.0.1:7125)
# proxied, as in Fluidd's and Mainsail's own nginx configs. Started by
# S63nginx. The root is read-only: pid and temp files in /run/nginx, the
# error log in /var/log/nginx (tmpfs).

user www-data;
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 128;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    client_body_temp_path /run/nginx/client-body;
    proxy_temp_path /run/nginx/proxy;

    # The image's Fluidd files are gzipped at build time (gzip_static);
    # this is for Moonraker's JSON and a Fluidd updated from Fluidd
    # (release zip, no .gz files)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types application/json text/plain text/css application/javascript
        image/svg+xml application/manifest+json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream apiserver {
        server 127.0.0.1:7125;
    }

    server {
        listen 80 default_server;
        server_name _;
        # Fluidd: the updatable copy in /data/ad5x/web/fluidd, or the
        # image's /usr/share/fluidd if there is none (written by S63nginx)
        include /run/nginx/fluidd-root.conf;
        index index.html;

        # G-code uploads: no size limit, streamed to Moonraker rather than
        # buffered in RAM (/run)
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        location / {
            gzip_static on;
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            gzip_static on;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /assets/ {
            gzip_static on;
            expires 30d;
        }

        location /websocket {
            proxy_pass http://apiserver/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # USB cameras (S64ad5x-camera: ustreamer on 127.0.0.1:8090, 8091)
        location /webcam/ { proxy_pass http://127.0.0.1:8090/; include webcam_proxy.conf; }
        location /webcam2/ { proxy_pass http://127.0.0.1:8091/; include webcam_proxy.conf; }
        # The touch screen with touch (S65ad5x-screen: ad5x-fbstream on 8092)
        location /screen/ { proxy_pass http://127.0.0.1:8092/; include webcam_proxy.conf; }

        # No regex locations: nginx is built without PCRE
        location /printer/ { include moonraker_proxy.conf; }
        location /api/ { include moonraker_proxy.conf; }
        location /access/ { include moonraker_proxy.conf; }
        location /machine/ { include moonraker_proxy.conf; }
        location /server/ { include moonraker_proxy.conf; }
    }

    # Extra servers (a second web UI on another port, e.g. Mainsail on 81),
    # written by root into /data/ad5x/nginx/. Root-owned only: this runs as
    # root. Files that do not exist are skipped.
    include /data/ad5x/nginx/*.conf;
}
