# The hardware watchdog's feeder (S05ad5x-watchdog; sourced). Kiln's U-Boot
# reads only whether this file exists in rootfs2: it means this system's
# kernels take over a watchdog left running and its userspace feeds it, so
# U-Boot starts Kiln's 6.6 or 7.3 with the watchdog running. Off switch:
# /data/ad5x/watchdog.disable (docs/data-layout.md).

# Reset after this many seconds without a feed (the kernels allow up to
# about 1431 s)
TIMEOUT=120
# Feed every PERIOD seconds
PERIOD=10
# Started by Kiln's U-Boot: the main OS's start-up must finish
# (S99ad5x-booted) within START_LIMIT seconds of boot, or the feeder stops
# and the watchdog resets the printer TIMEOUT seconds later; U-Boot then
# counts the start as unconfirmed. Not while a print runs. 0: no limit.
START_LIMIT=900
