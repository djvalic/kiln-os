# Named root actions for plugins (docs/plugin-root-actions.md). Empty on
# purpose: the feature is in the image, but no action is offered or granted.
# One block per action (read as data by lib/dev-root.sh, never run):
#   action NAME
#   script /usr/share/ad5x/root-actions/FILE
#   args COUNT
#   arg INDEX REGEX
#   writes PATH          (optional, for the table only)
#   print_safe yes|no    (default no)
